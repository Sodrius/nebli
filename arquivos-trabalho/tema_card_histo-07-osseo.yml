profundidade: "PADRÃO"

termos_nota_obrigatorios:
  - "osteoblasto — célula formadora de matriz óssea, derivada do mesênquima"
  - "osteócito — célula óssea madura aprisionada em lacuna, conectada por canalículos"
  - "osteoclasto — célula gigante multinucleada que reabsorve matriz óssea, vinda da linhagem monócito-macrófago"
  - "periósteo — bainha de conjuntivo denso que reveste a superfície externa do osso"
  - "endósteo — camada celular fina que reveste cavidades internas do osso"
  - "hidroxiapatita — Ca₁₀(PO₄)₆(OH)₂, sal mineral que confere dureza à matriz óssea"
  - "lacuna de Howship — depressão na superfície óssea onde o osteoclasto reabsorve matriz"
  - "ósteon — unidade estrutural do osso lamelar; canal central com lamelas concêntricas (sistema de Havers)"

pontos_quebra:
  - quebra: "Osteoblasto e osteoclasto NÃO são versões da mesma célula"
    correcao: "Osteoblasto vem do mesênquima (linhagem osteoprogenitora). Osteoclasto vem de monócito/macrófago (linhagem hematopoética). Funções opostas, origens completamente distintas. Confunde com condroblasto/condrócito que SÃO mesma linhagem em idades distintas."
    origem: "Ross & Pawlina cap. 8"
  - quebra: "Osteócito não é osteoblasto inativo"
    correcao: "Quando osteoblasto fica aprisionado pela matriz que secreta, vira osteócito — muda morfologia e função. Mantém a célula viva por décadas, com papel de mecanotransdução e manutenção. Não é mero residente passivo."
    origem: "Kierszenbaum"
  - quebra: "RANK/RANKL/OPG é o eixo central da remodelação"
    correcao: "Osteoblasto expressa RANKL e OPG. RANKL ativa o osteoclasto pelo RANK (estimula reabsorção). OPG é receptor-armadilha, sequestra RANKL (inibe reabsorção). Estrogênio aumenta OPG — por isso menopausa acelera perda óssea."
    origem: "Junqueira/Carneiro"
  - quebra: "Matriz óssea calcificada NÃO é cartilagem calcificada"
    correcao: "Matriz óssea tem colágeno tipo I (não II), em feixes orientados; hidroxiapatita depositada sobre o colágeno. Cartilagem calcificada tem colágeno II e PG, mineralizada sem reorganização. São matrizes quimicamente distintas."
    origem: "armadilha clássica"
  - quebra: "Ossificação intramembranosa NÃO precisa de cartilagem"
    correcao: "Vai direto de membrana mesenquimal a osso (frontal, parietal, partes do occipital, temporal, maxilas, clavícula). A endocondral usa cartilagem como molde. São histogêneses paralelas, não etapas."
    origem: "Junqueira/Carneiro cap. 8"
  - quebra: "Sistema de Havers é unidade do osso lamelar, NÃO do esponjoso"
    correcao: "Ósteon = canal central + lamelas concêntricas + osteócitos em lacunas + canalículos. É a estrutura do osso compacto lamelar. O esponjoso tem trabéculas lamelares também, mas sem ósteons completos (sem canal central com vaso)."
    origem: "Ross & Pawlina"
  - quebra: "Reabsorção óssea NÃO é destruição passiva"
    correcao: "Osteoclasto cria selo (zona de vedação por integrinas e actina), borda franzida bombeia H⁺ via V-ATPase (acidifica a lacuna de Howship), HCl dissolve hidroxiapatita, catepsina K e colagenases digerem colágeno I. Reabsorção é ativa, regulada, e seguida de apoptose do osteoclasto."
    origem: "Kierszenbaum"
  - quebra: "Periósteo e endósteo não são só revestimento"
    correcao: "Periósteo (externo, conjuntivo denso) e endósteo (interno, camada celular fina) ambos têm células osteoprogenitoras. São as fontes de osteoblasto novo para crescimento em espessura e para reparo de fratura. Sem eles, o osso não cicatriza."
    origem: "Ross & Pawlina"

