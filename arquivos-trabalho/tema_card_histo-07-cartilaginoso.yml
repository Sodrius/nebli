termos_nota_obrigatorios:
  - "condroblasto — célula jovem secretora de matriz cartilaginosa"
  - "condrócito — célula madura aprisionada em lacuna"
  - "pericôndrio — bainha de conjuntivo denso que envolve e nutre a cartilagem"
  - "grupo isógeno — agrupamento de condrócitos vindos de um único condroblasto"
  - "proteoglicano — eixo proteico + cadeias de GAG; retém água por carga negativa"
  - "ácido hialurônico — GAG livre que ancora agregados de proteoglicanos"
  - "condronectina — glicoproteína multiadesiva que prende condrócito ao colágeno II"
  - "matriz territorial — halo basófilo rico em PG ao redor das lacunas"

pontos_quebra:
  - quebra: "Cartilagem é avascular, mas tem nutrição"
    correcao: "Pericôndrio leva sangue na borda; nutriente difunde pela MEC hidratada até o condrócito. O metabolismo do condrócito é anaeróbio porque a difusão de O₂ não alcança o interior."
    origem: "Junqueira/Carneiro cap. 7"
  - quebra: "Condroblasto e condrócito não são tipos diferentes — são idades"
    correcao: "Mesma linhagem: jovem secretora na borda (condroblasto) vira madura aprisionada (condrócito). Não confundir com condroclasto (questionado pela literatura)."
    origem: "armadilha clássica"
  - quebra: "Crescimento intersticial NÃO acontece em adulto"
    correcao: "Condrócito maduro perde capacidade mitótica. Crescimento intersticial só ocorre na cartilagem jovem (fetal/infantil). No adulto sobra aposicional, limitado."
    origem: "Ross & Pawlina + ponto de quebra"
  - quebra: "Colágeno II é exclusivo de hialina e elástica — fibrosa tem tipo I"
    correcao: "Fibrocartilagem é híbrido: colágeno tipo I (do conjuntivo denso) + algumas fibras tipo II. Por isso resiste a tração, não a compressão pura."
    origem: "Kierszenbaum"
  - quebra: "Fibrocartilagem não tem pericôndrio"
    correcao: "É sempre contígua a conjuntivo denso modelado (tendão, ligamento). A nutrição vem por esse conjuntivo, não por uma bainha própria."
    origem: "Junqueira/Carneiro"
  - quebra: "Matriz territorial vs interterritorial não é decoração de prova"
    correcao: "Territorial (ao redor da lacuna) é basófila — rica em PG recém-secretados. Interterritorial é mais antiga, mais colagenosa. Lê na lâmina porque os condrócitos novos colorem o entorno."
    origem: "histologia clínica"
  - quebra: "Cartilagem não se regenera bem porque não há vaso para entregar célula nova"
    correcao: "A célula que repararia (condroblasto) precisa vir do pericôndrio. Sem vaso na lesão profunda, não chega progenitora. O reparo vira tecido conjuntivo cicatricial."
    origem: "ponto de quebra clínico"
  - quebra: "Líquido sinovial nutre cartilagem articular — não pericôndrio"
    correcao: "A superfície articular é nua: sem pericôndrio. A nutrição vem do líquido sinovial por difusão. Por isso lesão articular é tão difícil de reparar."
    origem: "Ross & Pawlina"

