# ============================================================
# Seção A — Prioridades desta corrida (do § Diário de revisões)
# ============================================================
prioridades_corrida:
  - prio: "Eixo prioritário do Davi: 'ver na lâmina'. Cada subtipo de epitélio recebe critério visual EMBUTIDO na prosa (forma e posição do núcleo, altura celular, polaridade, especializações apicais). Não vira PARTE separada."
  - prio: "Figura é obrigatória mesmo em tema espacial (Diário 2026-05-29 · biocel-07). Histo é o tema mais visual do semestre — meta ≥4 figuras por PARTE. Se slide não cobre um subtipo bem, reaproveitar slide adjacente ou parar e perguntar."
  - prio: "Banda dupla 0.80-1.25 paridade Q01-Q30 com relatório obrigatório."
  - prio: "Pergunta âncora / retórica / ingênua BANIDAS na abertura. 5 registros canônicos."
  - prio: "Filtro de admissão Integração (Q11-Q25): mapa A+B gravado antes de redigir."
  - prio: "Tabela auditável de figuras (Figura | PARTE | Origem | Mecanismo | Largura) no fechamento."

# ============================================================
# Seção B — Esqueleto das 3 PARTES
# ============================================================
estrutura_e1:
  parte_1:
    titulo: "O que torna um epitélio um epitélio"
    subtopicos:
      - "Origem nas três folhas embrionárias e a divisão arbitrária do corpo em 4 tecidos básicos"
      - "Justaposição com pouca matriz: a marca registrada que separa epitélio de conjuntivo na lâmina"
      - "Polaridade apico-basal: domínios diferentes na mesma célula"
      - "Junções celulares: como manter o folheto colado e como decidir o que passa por entre as células"
      - "Lâmina basal e membrana basal: a fronteira que segura tudo embaixo"
      - "Avascularidade obrigatória: por que vaso não cruza o folheto e como o nutriente chega"
    figuras_planejadas:
      - "slide-04 — quadro dos 4 tecidos básicos (PARTE 1 abertura, ~50%)"
      - "slide-07 — origem nas 3 folhas embrionárias (~55%)"
      - "slide-14 — vias trans/paracelular (~60%)"
      - "slide-21 — zônulas oclusão e adesão (~65%)"
      - "slide-30 — Clostridium perfringens atacando zônula (clínica, ~55%)"
      - "slide-36 — lâmina basal + fibras reticulares = membrana basal (~60%)"
      - "slide-39 — membrana basal HE vs PAS (assinatura visual, ~65%)"
  parte_2:
    titulo: "Atlas de identificação: nomear o epitélio que está na lâmina"
    subtopicos:
      - "O algoritmo de classificação: número de camadas × forma da camada superficial × especialização apical"
      - "Simples pavimentoso: a 'linha de núcleos achatados' do endotélio e mesotélio"
      - "Simples cúbico: núcleo redondo no centro — túbulos renais e folículos da tireoide"
      - "Simples cilíndrico (colunar): núcleo oval na base — vesícula biliar e intestino"
      - "Pseudoestratificado: parece estratificado mas todas as células tocam a basal — o impostor do trato respiratório"
      - "Estratificado pavimentoso: queratinizado (epiderme) × não queratinizado (esôfago, vagina)"
      - "Transição (urotélio): muda de cara conforme a bexiga enche"
      - "Especializações apicais como pistas: microvilos (borda em escova), estereocílios, cílios móveis, cílio primário"
