  parte_3:
    titulo: "O epitélio que secreta: glandulares exócrinos e endócrinos"
    subtopicos:
      - "Como uma glândula nasce de um epitélio de revestimento: o broto que descola e o broto que se mantém ligado"
      - "Caliciformes: a glândula unicelular embutida no epitélio cilíndrico"
      - "Exócrinas pluricelulares — três eixos de classificação cruzados: forma do ducto, ramificação da porção secretora, forma da porção secretora"
      - "Natureza do produto: mucosa (citoplasma claro, núcleo achatado na base) × serosa (citoplasma corado, núcleo arredondado) × mista"
      - "Células mioepiteliais: o músculo da glândula"
