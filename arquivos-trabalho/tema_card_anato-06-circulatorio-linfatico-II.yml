# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: SUPERFICIAL de conteúdo molecular, mas o resumo NÃO é raso — é
#   anatomia macro. Distribuição E2 mapeada em PADRÃO por razão de infra (labels do
#   gerar_main.py: Q01-10 Cons / Q11-25 Int / Q26-30 Apl). Blueprint = BAIXO rendimento
#   Step 1 → NÃO forçar clínica externa; foco puro no que o slide entrega.
#   Fio único: o sangue anda em CIRCUITOS, não em linha reta. Todo nome de vaso que
#   parece decoreba é, na verdade, uma etapa de um trajeto fechado. A aula mostra (1) os
#   quatro circuitos (pulmonar, sistêmica, coronariana, fetal) — a lógica antes dos nomes;
#   (2) a árvore arterial, onde cada ramo da aorta serve um território previsível; (3) o
#   retorno venoso e linfático, onde o sangue volta por caminhos paralelos e o desvio pelo
#   fígado, a ponte ázigo e o bloqueio das cavas viram clínica. Cada vaso é lido pelo lugar
#   que ocupa no circuito, nunca como item de lista solta.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 13-17 — pedido explícito de Davi: "claro e
#   pequeno". Anatomia não precisa de 22 páginas; o valor é o ANDAIME lógico que faz os
#   nomes penderem de um trajeto, não o catálogo exaustivo. Catálogo de ramos entra por
#   figura-fluxograma + quebra-de-prosa controlada, jamais como parágrafo enfileirado).
# Recorte slide × tema: DECLARADO. O deck (47 slides) + complementar (9 fluxogramas)
#   entregam ANATOMIA VASCULAR SISTÊMICA — artérias e veias, região por região — mais a
#   classificação dos tipos de circulação. Duas divergências com o título "Circulatório e
#   Linfático II":
#     (a) CIRCULAÇÃO FETAL aparece só nomeada no slide-02 (sem figura própria). Entra como
#         subtópico conceitual compacto (os 3 shunts e o porquê), NÃO como seção grande —
#         é conteúdo canônico da lista da professora e a lógica "o que muda ao nascer" é
#         pedagogicamente rica, mas sem inventar figura que o slide não tem.
#     (b) SISTEMA LINFÁTICO não está nas figuras deste deck, MAS é conteúdo da aula (título
#         + banco q-0359 testa ducto torácico/linfático direito/cisterna do quilo/ângulo de
#         Pirogoff). Entra compacto no fim da PARTE III como "o terceiro caminho de volta".
#   Ambos tratados em prosa curta de mecanismo — sem figura fabricada (lição biocel-07: sem
#   slide ≠ inventar; aqui a prosa basta porque o mecanismo é simples e verbalizável).
#
# Prioridades desta corrida (Diário de revisões + pedido de Davi):
#   P1. "Claro e pequeno" (pedido literal). Andaime lógico > exaustividade. Alvo 13-17 pp.
#       Catálogo de ramos = figura-fluxograma (complementar) + prosa de princípio, nunca
#       parágrafo-lista de nomes. Isto é o eixo editorial desta corrida.
#   P2. Diário biocel-07 (peso alto): conteúdo ESPACIAL exige figura. Trajeto do sangue pelo
#       coração → slide-03 (numerado, a figura-mãe). Coronárias → slide-07. Árvore arterial
#       → fluxogramas do complementar. Retorno venoso/porta/ázigo/obstrução → slides 23,30,
#       33,38. Nenhuma cadeia espacial fica sem figura.
#   P3. Sem pergunta-âncora/retórica de abertura (canônico 2026-05-29). Abertura = afirmação
#       direta + mecanismo. 5 registros rotacionados (Seção B.bis).
#   P4. Prosa fluida, NUNCA empilhamento de nomes de vaso. "Artéria X, artéria Y, artéria Z"
#       coladas = anti-padrão. Cada vaso entra numa frase que diz o que ele irriga/drena.
#   P5. E2: 10 C/E (cada um 4 itens I-IV, gate hard) nas 3 categorias + 3 "assinale a
#       incorreta"; gabarito sorteado + guarda anti-degeneração; paridade banda dupla
#       0.80-1.25 Q01-Q30; cada um dos 13 subtópicos testado >=2x.
#   P6. Blueprint BAIXO: clínica só a que o slide traz (obstrução de cava é do próprio slide-38,
#       portanto vale). Não importar cenário de residência externo.

