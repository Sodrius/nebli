# ---------------------------------------------------------------------------
# SEÇÃO B — Esqueleto + figuras planejadas
# ---------------------------------------------------------------------------
# PARTE I:
#   1.1 Coração = duas bombas em série; pulmonar (VD→pulmão→AE, oxigena) e sistêmica
#       (VE→corpo→AD, entrega O2). Em série: todo o débito passa pelos dois. VE tem parede
#       mais grossa (pressão do corpo inteiro). [fig slide-02 tipos ~48% ou slide-05]
#   1.2 Trajeto passo a passo: VCS+VCI+seio coronário→AD→tricúspide→VD→pulmonar→tronco
#       pulmonar→aa. pulmonares→pulmão→vv. pulmonares→AE→bicúspide/mitral→VE→aórtica→aorta.
#       PONTO-DE-QUEBRA: "artéria" = sai do coração, NÃO = sangue oxigenado (a. pulmonar
#       carrega sangue venoso; vv. pulmonares carregam arterial). [fig slide-03 numerado
#       ~72% — a figura-mãe, CADEIA multi-passo OBRIGATÓRIA]
#   1.3 Coronárias nascem da RAIZ da aorta (logo acima da valva aórtica), a. coronária D e E;
#       drenagem pelo seio coronário → AD. O coração é o 1º território irrigado pela aorta.
#       [fig slide-07 coronária anterior/posterior + origem ~62%]
#   1.4 Fetal: pulmão não ventila, placenta oxigena. 3 atalhos: ducto venoso (fígado bypass),
#       forame oval (AD→AE direto), ducto arterioso (tronco pulmonar→aorta). Ao nascer, 1ª
#       respiração fecha os shunts. Compacto, conceitual, SEM figura fabricada. [sem fig]
# PARTE II:
#   2.1 Aorta: ascendente (só coronárias) → arco → descendente torácica → descendente
#       abdominal → bifurca em ilíacas comuns. Princípio: artéria nomeada pelo território.
#       [fig slide-05 sistêmica corpo inteiro ~55%]
#   2.2 Arco: 3 ramos — tronco braquiocefálico (→ carótida comum D + subclávia D),
#       carótida comum E, subclávia E. Carótidas+vertebrais→polígono de Willis (anastomose=
#       rede de segurança). Subclávias→membros superiores. [fig complementar slide-02
#       fluxograma arco ~70%; fig slide-09 Willis ~50%]
#   2.3 Torácica descendente: viscerais (bronquiais, esofágicas, pericárdicas, mediastinais)
#       × parietais (intercostais post., subcostais, frênicas sup.). Princípio visceral/parietal.
#       [fig complementar slide-03 fluxograma torácica+abdominal ~72% — cobre 2.3 e 2.4]
#   2.4 Abdominal: ímpares viscerais (tronco celíaco→fígado/estômago/baço; mesentérica sup.→
#       delgado+cólon D; mesentérica inf.→cólon E+reto); pares (suprarrenais, renais, gonadais);
#       parietais (frênicas inf., lombares); depois ilíacas comuns→externa (MMII) + interna
#       (pelve). [fig complementar slide-04 aorta abdominal com níveis vertebrais ~62%]
# PARTE III:
#   3.1 Três tipos de veia: profundas (acompanham artérias, vv. acompanhantes), superficiais
#       (safena magna/parva, na tela subcutânea), perfurantes (furam a fáscia, ligam
#       superficial→profundo). Fluxo normal: superficial→profundo. [fig slide-23 tipos ~60%]
#   3.2 Duas cavas: VCS (cabeça/pescoço/MMSS/tórax) e VCI (abdome/pelve/MMII) → AD. DESVIO
#       PORTAL: sangue do TGI+baço NÃO volta direto — vv. mesentéricas+esplênica formam a
#       veia porta → fígado (processa nutrientes/detox) → vv. hepáticas → VCI. Circuito com
#       dois leitos capilares em série. [fig slide-30 porta ~60%]
#   3.3 Ázigo: via colateral venosa entre VCS e VCI, tributária da VCS; drena parede torácica
#       (intercostais), com hemiázigo/hemiázigo acessória à esquerda. É a rota alternativa
#       quando uma cava obstrui. [fig slide-33 ázigo ~60%]
#   3.4 Obstrução: síndrome da VCS (face/pescoço congestos, colaterais no tórax); obstrução
#       VCI (colaterais na parede abdominal, ázigo assume). A anastomose que parecia detalhe
#       vira via de salvamento. atencao-box aqui. [fig slide-38 obstrução clínica ~66%]
#   3.5 Linfa: retorna líquido intersticial ao sangue. Ducto torácico (da cisterna do quilo,
#       ~75% do corpo: MMII, abdome, hemitórax E, hemicorpo E) + ducto linfático direito
#       (quadrante superior D). Ambos desembocam no ângulo subclávia–jugular interna
#       (ângulo de Pirogoff). Compacto. [sem fig — prosa]
#
# SEÇÃO B.bis — Registro de abertura (rotação, sem vizinho igual):
#   1.1 enquadramento · 1.2 integração-anterior · 1.3 ponto-de-quebra · 1.4 integração-posterior
#   2.1 enquadramento · 2.2 analogia · 2.3 ponto-de-quebra · 2.4 integração-anterior
#   3.1 enquadramento · 3.2 ponto-de-quebra · 3.3 analogia · 3.4 integração-anterior · 3.5 integração-posterior
#
# SEÇÃO B.ter — Pré-requisitos cruzados (frase-âncora pronta ≤25 palavras):
#   - Artéria vs veia (definição funcional): "artéria é o vaso que SAI do coração e veia o que
#     CHEGA — a definição é a direção do fluxo, não se o sangue é oxigenado ou não."
#   - Leito capilar: "capilar é a rede fininha onde o sangue troca gases e nutrientes com o
#     tecido; entre uma artéria e uma veia há sempre um leito desses."
#   - Anastomose: "anastomose é uma conexão entre dois vasos que cria um caminho alternativo —
#     se um trecho fecha, o sangue desvia pelo outro."
#   - Território (de irrigação/drenagem): "território é a região que um vaso serve; conhecer o
#     território é saber o que sofre quando aquele vaso falha."
#
# SEÇÃO C — Distribuição E2 (mapeada PADRÃO por infra): 10 Cons (Q01-10) · 15 Int (Q11-25) ·
#   5 Apl (Q26-30). Formatos: 10 C/E (Q03,06,09,12,15,18,21,24,27,30), 3 "assinale a incorreta"
#   (Q04,14,22), resto MC. Cada C/E com 4 itens I-IV (gate hard). Paridade banda dupla nos MC.
#   Cobertura: cada um dos 13 subtópicos testado >=2x (tabela no fechamento).
#
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo):
#   - Quebra: aluno acha que "artéria = sangue oxigenado, veia = sangue venoso".
#     Correção: artéria/veia é a DIREÇÃO (sai/chega ao coração). A a. pulmonar leva sangue
#     venoso ao pulmão; as vv. pulmonares trazem sangue oxigenado. (q-0359 vizinhança)
#   - Quebra: aluno inverte tricúspide e bicúspide/mitral.
#     Correção: TRIcúspide é a direita (átrio D→ventrículo D); bicúspide/mitral é a esquerda.
#   - Quebra: aluno acha que as coronárias saem do arco da aorta.
#     Correção: nascem da RAIZ (aorta ascendente, logo acima da valva aórtica) — por isso são
#     as primeiras a se encher, na diástole.
#   - Quebra: aluno acha que o sangue do intestino volta direto pela cava.
#     Correção: passa antes pelo fígado via veia porta (2 leitos capilares em série) — só
#     depois vai à VCI pelas vv. hepáticas.
#   - Quebra: aluno confunde o que cada cava drena.
#     Correção: VCS = acima do diafragma (cabeça, pescoço, MMSS, tórax); VCI = abaixo
#     (abdome, pelve, MMII).
#   - Quebra: aluno não vê por que o sistema ázigo importa.
#     Correção: é a ponte colateral entre VCS e VCI; quando uma cava obstrui, o sangue foge
#     por ela — é o que salva o retorno.
#   - Quebra: aluno troca ducto torácico e ducto linfático direito.
#     Correção: o direito drena só o quadrante superior D; o torácico drena ~75% do corpo, da
#     cisterna do quilo. Ambos no ângulo subclávia-jugular. (q-0359)
#   - Quebra: aluno acha que a mesentérica inferior irriga o intestino delgado.
#     Correção: delgado + cólon direito = mesentérica superior; cólon esquerdo + reto =
#     mesentérica inferior.
#
# SEÇÃO E — Exemplares-âncora:
#   - Cat 1 (universal, abertura por enquadramento + mecanismo): abrir cada circuito/árvore
#     pela função que ele serve, não pelo nome.
#   - Cat 8 (universal, cadeia causa→consequência): o trajeto do sangue é a cadeia-mãe;
#     escrever como fluxo contínuo, cada passo puxando o próximo.
#   - Cat 14 (universal, voz de monitor fluida): nomes de vaso sempre dentro de frase com
#     verbo ("a carótida sobe para o encéfalo"), nunca listados.
#   - Cat 18 gatilho 1 (quebrar prosa p/ catálogo de tipos discretos): usar SÓ na tabela
#     visceral×parietal e nos 3 tipos de veia (contrastes paralelos), NÃO na cadeia do trajeto.
#   - Cat 11 (distratoras mecanísticas) para a E2; Cat 10 para o modelo de resposta da E3.

