# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Tema integrativo de fim de P2/P3:
#   amarra glicólise, gliconeogênese, sinalização (PKA/cAMP) e clínica (glicogenoses).
# Alvo de páginas E1: piso 2, TETO 22 (alvo 14-18).
# Recorte: o slide cobre estrutura, as duas vias, regulação alostérica/covalente/hormonal
#   e doenças de depósito. Tema pedido = exatamente isso. Sem recorte a declarar.
#
# Prioridades desta corrida (foco do Davi = aplicar os "pequenos ajustes" de 2026-06-24):
#   P1. Escrita matemática em ETAPAS ROTULADAS no custo de 2 ATP/glicose (anti-padrão A1).
#   P2. Abrir cada camada regulatória pelo PROBLEMA que ela resolve (anti-padrões A2/A3).
#   P3. Resumindo enxuto: 6-10 seções, ~30-45 palavras de frase encadeada (item 36).
#   P4. Nomes de subtópico diretos, não-poéticos (item 35).
#   P5. Quebrar a prosa SÓ nas glicogenoses (tabela = gatilho 1/3 da Categoria 18); resto prosa.
#   P6. E2: ~10 C/E nas 3 categorias + 3 "assinale a incorreta" + 2 questões de cálculo;
#       gabarito sorteado de verdade + guarda anti-degeneração; paridade banda dupla Q01-Q30.
#   P7. Diário de revisões (biocel-07): tema espacial/cadeia → figura obrigatória mesmo sem
#       ser slide perfeito. Aqui há slides ricos (estrutura, vias, cascata) — usar.

sumario:
  - titulo: "Etapa 1 — Texto didático"
    blocos:
      - titulo: "PARTE I — Por que o corpo guarda glicose em forma de glicogênio"
        subtopicos:
          - "1.1 O problema osmótico que a polimerização resolve"
          - "1.2 A árvore ramificada e suas duas pontas"
          - "1.3 Fígado guarda para o sangue, músculo guarda para si"
      - titulo: "PARTE II — As duas vias: desmontar e remontar a árvore"
        subtopicos:
          - "2.1 Glicogenólise: fosforólise em vez de hidrólise"
          - "2.2 A enzima desramificadora e o destino da glicose-6-fosfato"
          - "2.3 Glicogênese: a glicose ativada como UDP-glicose"
          - "2.4 O custo de 2 ATP por glicose incorporada"
      - titulo: "PARTE III — A regulação que liga uma via e desliga a outra"
        subtopicos:
          - "3.1 Controle alostérico: o músculo lê AMP, o fígado lê glicose"
          - "3.2 A cascata do glucagon: cAMP, PKA e a amplificação do sinal"
          - "3.3 Um fosfato, efeitos opostos: fosforilase liga, sintase desliga"
          - "3.4 Quando a via falha: as doenças de depósito de glicogênio"

