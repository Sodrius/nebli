# ---------------------------------------------------------------------------
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo)
# ---------------------------------------------------------------------------
# - Quebra: achar que a transaminação REMOVE o nitrogênio do corpo.
#   Correção: a transaminação apenas TRANSFERE o grupo amino para o alfa-cetoglutarato,
#     concentrando o N no glutamato; quem realmente solta o N (como amônia) é a
#     DESAMINAÇÃO pela glutamato desidrogenase. (livro-texto)
# - Quebra: confundir CPS-I com CPS-II.
#   Correção: CPS-I usa AMÔNIA livre, fica na mitocôndria e abre o ciclo da ureia; CPS-II
#     usa o nitrogênio da GLUTAMINA, fica no citosol e serve à síntese de pirimidinas —
#     enzimas diferentes com o mesmo apelido. (livro-texto)
# - Quebra: tratar aminoácido cetogênico como se pudesse virar glicose.
#   Correção: cetogênico entra como acetil-CoA/acetoacetato, e acetil-CoA NÃO reverte a
#     piruvato — logo não alimenta a gliconeogênese; só o esqueleto glicogênico (piruvato/
#     intermediário de Krebs) vira glicose. (livro-texto)
# - Quebra: dizer que o ciclo da ureia "gasta 4 ATP e pronto".
#   Correção: gasta 4 ligações de alta energia, mas o fumarato do passo 4 entra no ciclo
#     de Krebs e gera NADH, recuperando parte do custo — o biciclo ureia/Krebs amortiza a
#     conta. (slide-48)
# - Quebra: supor que a amônia viaja livre no sangue até o fígado.
#   Correção: amônia livre é neurotóxica; ela viaja de forma atóxica presa como glutamina
#     (glutamina sintetase) e alanina, e só é liberada no fígado/rim pela glutaminase. (armadilha clínica)
# - Quebra: assumir que todo erro inato do metabolismo de aminoácidos é autossômico recessivo.
#   Correção: a deficiência de OTC é LIGADA AO X — afeta mais meninos e não segue o padrão
#     recessivo autossômico da maioria (PKU, por exemplo, é recessiva autossômica). (armadilha clínica)
# - Quebra: achar que endopeptidase e exopeptidase cortam a proteína do mesmo jeito.
#   Correção: endopeptidase (pepsina, tripsina) quebra ligações INTERNAS gerando peptídeos
#     menores; exopeptidase apara das PONTAS (carboxipeptidase = C-terminal, aminopeptidase
#     = N-terminal), liberando aminoácidos avulsos. (livro-texto)

