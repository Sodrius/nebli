# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Blueprint = ALTO rendimento.
#   Fio mecanístico único que amarra tudo: cada aminoácido tem DUAS metades com destinos
#   separados — o NITROGÊNIO (tóxico como amônia → tem de virar ureia atóxica) e o
#   ESQUELETO DE CARBONO (vira glicose, corpo cetônico ou energia via Krebs). A aula
#   inteira é a história de como o corpo separa essas duas metades e descarta o
#   nitrogênio com segurança. Integração natural: transaminação×Krebs (α-cetoglutarato
#   /oxaloacetato), esqueleto×gliconeogênese, ciclo da ureia×Krebs (biciclo do
#   aspartato/fumarato), amônia×neurotoxicidade, erros inatos×genética.
# Blueprint (ALTO): aprofundar com 1-2 frases de mecanismo — CPS-I vs OTC, transaminação
#   como transferência (não remoção) de N, destino do esqueleto carbônico. Ângulo E2/E3
#   de Aplicação: hiperamonemia, deficiência de OTC (ligada ao X), encefalopatia
#   hepática. Gancho clínico invisível: erros inatos do metabolismo. Fonte invisível —
#   nunca citar "Step 1/residência/USMLE" no PDF.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 16-20 — tema denso, cobrir do turnover à
#   clínica sem comprimir o essencial).
# Recorte: 1 slide da aula "Metabolismo de aminoácidos" (62 páginas). O slide é AMPLO —
#   vai de balanço nitrogenado e digestão até ciclo da ureia e doenças (PKU). Cobrir o
#   arco todo, com o PESO no núcleo ALTO-rendimento (transaminação/desaminação, amônia,
#   ciclo da ureia). Estrutura fina/química do aminoácido (pKa, ponto isoelétrico) é do
#   bioq-04 (UC01) — aqui só retomada em 1 frase quando necessário. Detalhe de vias de
#   aminoácidos individuais (ex.: Hartnup, alcaptonúria) fica de fora; PKU entra como
#   erro representativo do lado do esqueleto carbônico.
#
# Prioridades desta corrida (Diário de revisões + pedido):
#   P1. Tema com forte componente ESPACIAL/de cascata (ciclo da ureia = 5 reações;
#       transaminação; transporte de amônia). Diário biocel-07 (peso alto): NÃO fechar
#       cadeia multi-passo sem figura. Ciclo da ureia (>=5 reações) = figura OBRIGATÓRIA
#       → slide-46. 9 figuras planejadas (3 por PARTE), todas do slide do professor.
#   P2. Sem pergunta-âncora/retórica de abertura (canônico 2026-05-29). Abertura =
#       afirmação direta + mecanismo.
#   P3. Prosa fluida, NUNCA rajada de siglas (canônico 2026-05-29). Amônia/glutamato/
#       α-cetoglutarato/CPS-I/OTC entram dentro de frase com sujeito+verbo+complemento.
#   P4. E2: ~10 C/E (cada um 4 itens I-IV, gate hard) nas 3 categorias + 3 "assinale a
#       incorreta"; gabarito sorteado + guarda anti-degeneração; paridade banda dupla
