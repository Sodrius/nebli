# ---------------------------------------------------------------------------
# SEÇÃO B.ter — Pré-requisitos cruzados com frase-âncora pronta
# ---------------------------------------------------------------------------
# - ciclo de Krebs: "sequência de reações na mitocôndria que oxida o acetil-CoA a CO2 e
#     entrega elétrons (NADH/FADH2) à cadeia respiratória; alfa-cetoglutarato, oxaloacetato,
#     fumarato e malato são intermediários dele"
# - gliconeogênese: "fabricação de glicose nova a partir de precursores não-glicídicos
#     (piruvato, lactato, esqueletos de aminoácidos) quando falta glicose na dieta"
# - coenzima: "molécula auxiliar que a enzima precisa para funcionar; aqui, o piridoxal-
#     fosfato (derivado da vitamina B6) carrega o grupo amino de um substrato a outro"
# - autossômico recessivo vs ligado ao X: "recessivo autossômico precisa das duas cópias
#     do gene com defeito; ligado ao X está no cromossomo X e afeta mais os homens, que
#     têm um X só"
# - barreira hematoencefálica: "filtro que separa o sangue do tecido do cérebro e controla
#     o que entra; algumas moléculas pequenas, como a fenilalanina em excesso, atravessam"

