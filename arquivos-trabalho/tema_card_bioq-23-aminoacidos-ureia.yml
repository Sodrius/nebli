# ---------------------------------------------------------------------------
# SEÇÃO B — Esqueleto das 3 PARTES + figuras planejadas
# ---------------------------------------------------------------------------
# PARTE I
#   1.1 Turnover: síntese e degradação nunca param; proteína que degrada != proteína que
#       sintetiza; ~400 g/dia degradados, 3/4 reciclados; aminoácidos não têm reserva
#       dedicada (nem glicogênio nem gordura equivalente).
#   1.2 Balanço nitrogenado = N ingerido - N excretado (ureia urinária 90%). Positivo
#       (crescimento, gravidez, recuperação), negativo (desnutrição, trauma, jejum),
#       zero (adulto saudável). Excesso de proteína NÃO é estocado como proteína — vira
#       gordura; o N sobra vira ureia.
#   1.3 Essenciais (9-10: Phe, Val, Thr, Trp, Ile, Met, His, Leu, Lys + Arg condicional)
#       vs não-essenciais (11 sintetizados). Efeito complementar (combinar proteínas de
#       deficiências diferentes); risco em dieta vegetariana. Kwashiorkor (deficiência
#       proteica → edema por baixa albumina) vs Marasmo (deficiência calórica global).
#       [fig slide-15 mapa de integração aa->Krebs — usar aqui como abertura do destino, 70%]
#   1.4 Digestão da dieta: endopeptidases (pepsina/tripsina/quimotripsina/elastase) cortam
#       ligações internas com especificidade; exopeptidases (carboxipeptidase A/B = C-term;
#       aminopeptidase = N-term) aparam as pontas; enzimas secretadas como ZIMOGÊNIOS
#       inativos (estômago/pâncreas/intestino) p/ não se autodigerirem. Degradação
#       endógena: catepsinas (lisossomo, inespecífico/extracelular) + ubiquitina-
#       proteassomo (citosólico, marcado, ATP-dependente, seletivo). Meia-vida variável
#       (ornitina descarboxilase min; hemoglobina 120 d). [fig slide-25 enzimas digestivas 55%; fig slide-32 proteassomo->aa->N/C 55%]
#   1.5 Destino do esqueleto de C: glicogênicos (viram piruvato/intermediário de Krebs ->
#       gliconeogênese: Ala, Gly, Ser, Cys, Glu, Asp...) vs cetogênicos (viram
#       acetil-CoA/acetoacetato -> corpos cetônicos, NÃO fazem glicose: Leu, Lys; alguns
#       mistos: Phe, Ile, Trp). Período absortivo (síntese) vs jejum (mobilização
#       tecidual, esqueleto p/ energia/glicose). [reaproveita slide-15]
# PARTE II
#   2.1 Duas metades: grupo alfa-amino (o nitrogênio) + esqueleto carbônico. O funil:
#       oxidar aminoácido = separar N (-> amônia -> ureia) do esqueleto (-> CO2+H2O,
#       glicose, corpos cetônicos). 20 aminoácidos convergem para poucas rotas.
#       [fig slide-17 funil de oxidação — abertura da PARTE, 60%]
#   2.2 Transaminação: o grupo amino da maioria é COLETADO no glutamato. Aminoácido +
#       alfa-cetoglutarato <-> alfa-cetoácido + glutamato. Ponto-chave: transaminação
#       TRANSFERE o N, não o REMOVE do corpo — concentra o N de muitos aminoácidos numa
#       molécula (glutamato) p/ processar depois. Reversível.
#   2.3 Transaminases (aminotransferases): citosol e mitocôndria; coenzima piridoxal-
#       fosfato (PLP, derivada de B6) carrega o grupo amino entre substratos. AST
#       (glutamato+oxaloacetato <-> aspartato+alfa-cetoglutarato) e ALT (marcadores
#       hepáticos). [fig slide-39 transaminação + desaminação (AST + glutamato DH), 65%]
#   2.4 Desaminação (fígado): glutamato desidrogenase libera NH4+ do glutamato,
#       regenerando alfa-cetoglutarato e usando NAD(P)+. É AQUI que o N deixa o esqueleto
#       de verdade, virando amônia livre. Glutamato -> aspartato (por AST) OU amônia —
#       ambos são precursores da ureia. [reaproveita slide-39]
#   2.5 Amônia é neurotóxica -> não viaja livre no sangue. Transporte atóxico: glutamina
#       (glutamina sintetase fixa NH4+ no glutamato; glutaminase o libera no fígado/rim)
#       e alanina (ciclo glicose-alanina do músculo). Astrócitos cerebrais fixam amônia
#       em glutamina (defesa do SNC). [fig slide-42 glutamina/alanina transporte, 60%]
# PARTE III
#   3.1 Por que ciclo: amônia é tóxica (SNC), tem de ser convertida em ureia (atóxica,
#       hidrossolúvel, excretada na urina). Só o fígado tem o ciclo completo. 2 N por
#       ureia: um da amônia (via CPS-I), outro do aspartato.
#   3.2 Cinco reações: (1) CPS-I: NH4+ + HCO3- + 2 ATP -> carbamoil-fosfato (mitocôndria;
#       enzima reguladora, ativada por N-acetilglutamato); (2) OTC: carbamoil-P + ornitina
#       -> citrulina (mitocôndria); citrulina sai p/ citosol; (3) argininossuccinato
#       sintetase: citrulina + aspartato + ATP -> argininossuccinato (2º N entra aqui);
#       (4) argininossuccinato liase -> arginina + FUMARATO; (5) arginase -> ureia +
#       ornitina (recomeça). Mitocôndria (1-2) + citosol (3-5). [fig slide-46 ciclo completo — CADEIA >=5 REAÇÕES = OBRIGATÓRIA, 75%]
#   3.3 Conta de ATP: gasta 4 ligações de alta energia (2 ATP no CPS-I + 1 ATP -> AMP+PPi
#       na argininossuccinato sintetase = 2 equivalentes). MAS o fumarato do passo 4
#       entra no Krebs -> malato -> oxaloacetato, gerando NADH (~2,5 ATP) e regenerando
#       aspartato: o "biciclo" ureia<->Krebs recupera parte do custo. Não é grátis, mas
#       não é tão caro quanto parece. [fig slide-48 regeneração de 3 ATP / biciclo, 60%]
#   3.4 Hiperamonemia: qualquer bloqueio do ciclo acumula amônia. CPS-I e OTC são os mais
#       comuns; OTC é LIGADA AO X (não autossômica recessiva como quase todos os outros
#       erros inatos). Amônia sobe -> encefalopatia (edema astrocitário por glutamina,
#       tremor, letargia, coma). Encefalopatia hepática: fígado cirrótico não depura amônia.
#       Tratamento conceptual: restringir proteína, desviar N (benzoato/fenilbutirato).
#   3.5 Fenilcetonúria (PKU): erro do ESQUELETO carbônico, não do N. Deficiência de
#       fenilalanina hidroxilase -> fenilalanina não vira tirosina -> acúmulo de Phe e
#       desvio p/ fenilpiruvato/fenillactato; Phe cruza a barreira hematoencefálica e
#       causa retardo mental; autossômica recessiva; triagem neonatal; dieta pobre em Phe.
#       Fecha o arco: mostra os dois lados (N e C) do metabolismo de aminoácidos falhando.
#       [fig slide-55 via da fenilalanina/PKU, 55%]
#
# Figuras planejadas (>=3 por PARTE): I=3 (slide-15, slide-25, slide-32) · II=3 (slide-17,
#   slide-39, slide-42) · III=3 (slide-46, slide-48, slide-55). Total 9. slide-47 (Krebs
#   puro) e slide-36 (só AST, redundante com 39) DESCARTADOS pelo filtro de utilidade.
#   Relatório auditável no fechamento.

