# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Tema descritivo-histológico, mas
#   com um eixo mecanístico que amarra tudo: PRESSÃO manda na PAREDE. Alta pressão
#   perto do coração → parede elástica/muscular espessa; baixa pressão no retorno →
#   veia de parede fina e luz ampla; troca no ponto de menor pressão → capilar de
#   uma célula. Integração natural: estrutura×função, tipo de capilar×órgão,
#   artéria×veia, endotélio×clínica (aterosclerose), linfático×edema.
# Blueprint (MÉDIO): aprofundar túnicas; endotélio (NO, von Willebrand);
#   capilar contínuo/fenestrado/sinusoide. Ângulo de Aplicação: aterosclerose
#   começa no endotélio; gancho clínico BR: aterosclerose, HAS, varizes.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 12-15 — pedido de Davi: sucinto).
# Recorte: slide único "sistema circulatorio - histologia.pdf" (23 pág, docente ML).
#   Cobre vasos sanguíneos + linfáticos; NÃO cobre coração (parede/valvas cardíacas)
#   nem anatomia macro — fica com os resumos de anatomia (anato-05/06). Foco: a
#   HISTOLOGIA da parede dos vasos.
#
# Prioridades desta corrida (do pedido literal de Davi + Diário de revisões):
#   P1. SUCINTO, mas completo e fluido. Amplo em cobertura, enxuto em cada ponto.
#       Nomes de subtópico diretos (item 35).
#   P2. "Usar tópicos": onde o conteúdo é catálogo de tipos discretos com 1 traço
#       definidor, virar TABELA (Cat 18 gatilho 1 + caso (a)/(c) do CLAUDE.md):
#       (i) artéria elástica × muscular; (ii) os 3 tipos de capilar; (iii) artéria ×
#       veia. Resto = prosa expositiva contínua de monitor.
#   P3. Tema VISUAL → fotomicrografia é o conteúdo. Usar os slides de fato (parede
#       rotulada, elástica×muscular no Weigert, capilar fenestrado, válvula venosa,
#       linfático×veia). Diário biocel-07 (peso alto): não fechar tema espacial sem figura.
#   P4. Aprofundar o endotélio em 1-2 frases de mecanismo (NO/vWF) e ligar à
#       aterosclerose SEM vocabulário de prova (blueprint invisível).
#   P5. E2: ~10 C/E nas 3 categorias + 1-2 "assinale a incorreta"; gabarito sorteado
#       de verdade + guarda anti-degeneração; paridade banda dupla 0.80-1.25 Q01-Q30.
#   P6. Sem pergunta-âncora/retórica de abertura (canônico 2026-05-29).

