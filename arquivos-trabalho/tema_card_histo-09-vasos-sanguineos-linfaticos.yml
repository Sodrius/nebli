# ---------------------------------------------------------------------------
# SEÇÃO B — Esqueleto das 3 PARTES + figuras planejadas
# ---------------------------------------------------------------------------
# PARTE I
#   1.1 O circuito (sanguíneo fechado: artéria→arteríola→capilar→vênula→veia; linfático
#       aberto/unidirecional que devolve o que vazou; funções: troca + retorno)  [fig slide-01]
#   1.2 As três túnicas (íntima=endotélio+subendotelial+LEI; média=músculo liso/elastina+LEE;
#       adventícia=conjuntivo+vasa vasorum+nervos)  [fig slide-03 — parede rotulada, 70%]
#   1.3 O endotélio ativo (pavimentoso simples, zônulas de oclusão, permeabilidade variável;
#       NO vasodilata, vWF na hemostasia; gancho aterosclerose)  [fig slide-04 lateral]
# PARTE II
#   2.1 Elásticas × musculares (TABELA; efeito Windkessel; lâminas fenestradas na média elástica;
#       músculo liso na muscular)  [fig slide-08 HE×Weigert, 65%]
#   2.2 Arteríola/metarteríola (\<0,5mm, 1-3 camadas músculo liso, parede≈luz; resistência periférica;
#       esfíncter pré-capilar; sistema porta breve)  [fig slide-09 lateral]
#   2.3 Capilares (endotélio único+lâmina basal+pericito; TABELA 3 tipos: contínuo/fenestrado/sinusoide
#       com órgão)  [fig slide-13 fenestrado, 60%]
# PARTE III
#   3.1 Veias (vênula pós-capilar→veia→cava; sem lâmina elástica, média escassa, adventícia espessa,
#       luz ampla; TABELA/prosa artéria×veia)  [fig slide-16 esquema artéria×veia, 60%]
#   3.2 Válvulas venosas (dobra da íntima em meia-lua; bomba muscular; varizes)  [fig slide-19 válvula, 55%]
#   3.3 Sistema linfático (capilar em fundo cego, sem junção de oclusão, filamentos de ancoragem;
#       estrutura como veia mas túnicas indistintas + mais válvulas; exceções SNC/medula/cartilagem/osso/
#       placenta; linfa→linfonodo→ducto torácico)  [fig slide-22 linfático×veia, 55%]
#
# Figuras planejadas (≥3 por PARTE, meta heurística): I=3 · II=3 · III=3. Relatório no fechamento.

# ---------------------------------------------------------------------------
# SEÇÃO B.bis — Registro de abertura por subtópico (sem repetir vizinho)
# ---------------------------------------------------------------------------
# 1.1 enquadramento | 1.2 integração-anterior | 1.3 ponto-de-quebra (o forro que decide o destino do vaso)
# 2.1 analogia concreta (amortecedor × torneira) | 2.2 integração-posterior (prepara o capilar) | 2.3 ponto-de-quebra (uma célula de espessura)
# 3.1 integração-anterior (mesma parede, pressão oposta) | 3.2 analogia concreta (comporta/eclusa) | 3.3 integração-posterior (fecha o circuito)

# ---------------------------------------------------------------------------
# SEÇÃO B.ter — Pré-requisitos cruzados com frase-âncora pronta
# ---------------------------------------------------------------------------
# - epitélio pavimentoso simples: "uma única fileira de células achatadas, finas como ladrilhos, ideais para trocas rápidas"
# - músculo liso: "células fusiformes involuntárias que se contraem devagar e sustentam tônus, sem estriação"
# - pressão hidrostática × difusão: "quanto mais longe do coração, menor a pressão; nos capilares ela é tão baixa que a troca vira difusão pura"
# - lâmina basal: "o tapete de matriz que o epitélio/endotélio secreta e sobre o qual se apoia"

# ---------------------------------------------------------------------------
# SEÇÃO C — Termo-notas obrigatórios (6-10)
# ---------------------------------------------------------------------------
# túnica íntima · túnica média · túnica adventícia · endotélio · lâmina elástica interna
# vasa vasorum · pericito · fenestração · esfíncter pré-capilar · válvula venosa · linfa

# ---------------------------------------------------------------------------
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo)
# ---------------------------------------------------------------------------
# - Quebra: inverter a composição da túnica média entre artéria elástica e muscular.
#   Correção: o nome diz o componente dominante da MÉDIA — elástica tem lâminas elásticas
#     concêntricas fenestradas (amortece o pulso); muscular tem músculo liso (regula o calibre). (q-0269)
# - Quebra: reduzir a diferença artéria×veia só ao calibre.
#   Correção: a veia tem média escassa, sem lâminas elásticas, adventícia espessa e colágena e luz
#     ampla — reflexo do regime de baixa pressão do retorno. (q-0270)
# - Quebra: tratar o endotélio como revestimento inerte.
#   Correção: é epitélio ativo — libera NO (vasodilata), fator de von Willebrand (hemostasia) e controla
#     trombose; quando disfunciona, começa a aterosclerose. (blueprint)
# - Quebra: achar que os 3 tipos de capilar diferem só pelo endotélio.
#   Correção: o divisor entre fenestrado e sinusoide é a LÂMINA BASAL — contínua no fenestrado,
#     descontínua no sinusoide (deixa passar células no fígado e medula). (livro-texto)
# - Quebra: supor que a válvula venosa é feita de músculo.
#   Correção: é dobra da túnica íntima em meia-lua; o retorno depende da bomba muscular esquelética
#     que comprime a veia por fora — falha da válvula gera varizes. (slide-18/19)
# - Quebra: dar ao capilar linfático junções de oclusão como o sanguíneo.
#   Correção: o linfático começa em fundo cego e NÃO tem junções de oclusão — é isso que permite a
#     entrada de líquido, proteínas e células que formam a linfa. (slide-21)

# ---------------------------------------------------------------------------
# SEÇÃO E — Exemplares-âncora
# ---------------------------------------------------------------------------
# Cat 1 (mecanismo parágrafo-a-parágrafo) → "pressão manda na parede" como fio condutor das 3 PARTES.
# Cat 7 (analogia construtiva, parcimônia) → aorta como amortecedor (Windkessel); arteríola como torneira;
#   válvula venosa como comporta/eclusa. 1 por subtópico onde a prosa pedir.
# Cat 16 (catálogo de família) + Cat 18 gatilho 1/caso (a) → 3 TABELAS: elástica×muscular, 3 capilares, artéria×veia.
# Cat 8 (atencao-box) com parcimônia → 1 box no máx por PARTE; reservar p/ inversão fenestrado×sinusoide (lâmina basal)
#   e p/ "válvula não é músculo". Resto vira confusao-prevista (gold) ou prosa dialogada.
# Cat 15 (#figura-lateral) → endotélio (slide-04), arteríola (slide-09): texto curto + figura média.
# Cat 14 (siglas footnote) → NO, vWF pouca sigla; foco em prosa, evitar rajada (ANTI-EXEMPLAR A4).

