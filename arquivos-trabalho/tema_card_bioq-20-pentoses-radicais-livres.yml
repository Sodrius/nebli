# ---------------------------------------------------------------------------
# SEÇÃO B — Esqueleto das 3 PARTES + figuras planejadas
# ---------------------------------------------------------------------------
# PARTE I
#   1.1 Três destinos da G6P: virar glicogênio (reserva), descer a glicólise (energia) ou
#       entrar na via das pentoses (biossíntese). A via das pentoses NÃO é para produzir
#       ATP — é para produzir INSUMOS de construção. Enquadra o resto. [sem figura própria;
#       preview com slide-08]
#   1.2 Os dois produtos: NADPH (poder redutor para vias anabólicas e defesa antioxidante)
#       + ribose-5-fosfato (o açúcar de 5C que forma nucleotídeos → DNA, RNA, ATP, coenzimas
#       NAD+/FAD/CoA). Nenhum ATP é produzido nem consumido líquido pela via em si.
#       [fig slide-08 overview G6P->ribose+2NADPH 60%; fig-lateral slide-33 ribose vs desoxirribose 34%]
#   1.3 NADPH ≠ NADH: mesma química de óxido-redução, papéis OPOSTOS. NADH é gerado na
#       oxidação (catabolismo) e leva elétrons à cadeia respiratória p/ fazer ATP; NADPH é
#       gerado na via das pentoses e DOA elétrons para biossíntese redutora (ácidos graxos,
#       colesterol) e para regenerar antioxidantes. A única diferença estrutural é um
#       fosfato extra no NADPH — a etiqueta que as enzimas leem p/ não confundir os dois
#       estoques. Razão fisiológica: NAD+/NADH ~1000 (célula quer NAD+ p/ oxidar);
#       NADPH/NADP+ alto (célula quer NADPH p/ reduzir). [fig-lateral slide-09 NADPH vs NADH — fosfato em vermelho 40%]
#   1.4 Onde/quando/quanto: citosol de todas as células; ~20% da glicose passa por ela;
#       mais ativa em fígado, tecido adiposo, glândula mamária, córtex adrenal, hemácia —
#       tecidos que SINTETIZAM lipídios/esteroides ou que precisam de defesa antioxidante.
#       Liga quando há glicose e a glicólise está freada (ATP alto). A hemácia é caso
#       especial: sem mitocôndria, a via das pentoses é sua ÚNICA fonte de NADPH. [sem fig nova]
# PARTE II
#   2.1 Duas fases com naturezas diferentes: OXIDATIVA (irreversível, produz NADPH + CO2 +
#       ribulose-5-P) e NÃO-OXIDATIVA (reversível, não produz NADPH, só interconverte
#       açúcares de 3-7 carbonos). A célula pode rodar as fases em velocidades diferentes.
#       Enquadra as duas subseções seguintes. [sem fig própria]
#   2.2 Fase oxidativa, 3 reações-chave: (1) G6PD oxida G6P a 6-fosfoglicono-δ-lactona,
#       reduzindo NADP+ a NADPH (passo controlador, irreversível); (2) lactonase hidrolisa
#       a lactona a 6-fosfogliconato; (3) 6-fosfogliconato desidrogenase oxida e
#       DESCARBOXILA (libera CO2), gerando ribulose-5-P + o 2º NADPH. Ribulose-5-P isomeriza
#       a ribose-5-P. Saldo: 2 NADPH + 1 CO2 + ribose por G6P. [fig slide-16 fase oxidativa + conexão glicólise 72% — CADEIA, OBRIGATÓRIA]
#   2.3 Fase não-oxidativa: quando a célula precisa de ribose mas não de tanto NADPH, OU
#       quando sobra ribose, transcetolase (transfere 2C) e transaldolase (transfere 3C)
#       remontam pentoses em frutose-6-P e gliceraldeído-3-P (e vice-versa) — intermediários
#       compartilhados com a glicólise. Tudo reversível: a via "conversa" com a glicólise
#       nos dois sentidos. Isomerase/epimerase ajustam as pentoses. [fig slide-49 transcetolase/transaldolase mecanismo 66%; fig slide-18 remontagem de carbono/reciclagem 62%]
#   2.4 Quatro cenários de demanda (governa QUAL ramo roda):
#       (a) precisa só de ribose (célula em divisão) → só a NÃO-oxidativa, a partir de
#           F6P/G3P da glicólise, sem gerar NADPH desnecessário;
#       (b) precisa de NADPH e ribose em igual medida → predomina a OXIDATIVA (entrega os dois);
#       (c) precisa de muito NADPH e pouca ribose (lipogênese) → oxidativa + não-oxidativa
#           reciclam a ribose de volta a F6P/G3P p/ re-render mais NADPH;
#       (d) precisa de NADPH e ATP → oxidativa + não-oxidativa, e o G3P desce a glicólise.
#       [reaproveita slide-18]
#   2.5 Regulação: a G6PD é o passo controlador. Ativada alostericamente por NADP+, INIBIDA
#       por NADPH (inibição por produto). A razão NADPH/NADP+ é o sensor: NADPH alto (célula
#       "cheia" de poder redutor) trava a via; NADPH consumido (NADP+ sobe) libera a via.
#       Elegante: a via se autorregula pelo próprio produto. [fig slide-51 regulação — G6PD inibida por NADPH 62%]
# PARTE III
#   3.1 Radicais livres: átomos/moléculas com elétron desemparelhado, muito reativos. A
#       própria respiração vaza ~0,2% do O2 como superóxido (~400 g/ano num adulto). Cascata
#       de espécies reativas de oxigênio (ERO): O2 → superóxido → peróxido de hidrogênio →
#       radical hidroxila. Superóxido dismutase e catalase/glutationa peroxidase desarmam a
#       cascata. Reação de Fenton (H2O2 + Fe2+ → hidroxila) explica por que ferro livre é
#       perigoso. [fig slide-39 cascata de ERO 60%]
#   3.2 A glutationa (GSH, tripeptídeo Glu-Cys-Gly): seu grupo -SH doa elétrons e neutraliza
#       o peróxido (via glutationa peroxidase), oxidando-se a GSSG (dímero). Para voltar a
#       funcionar, GSSG precisa ser REDUZIDA de volta a 2 GSH — e quem faz isso é a glutationa
#       redutase, gastando NADPH. Aqui fecha o circuito: G6PD → NADPH → glutationa reduzida →
#       ERO neutralizada. Sem NADPH, o escudo fica descarregado. [fig slide-41 loop NADPH->glutationa->remoção ERO 75% — figura integradora]
#   3.3 A hemácia no fio da navalha: carrega O2 (fonte constante de ERO), não tem mitocôndria
#       (sem outra fonte de NADPH) e não sintetiza proteínas novas (não repõe enzimas
#       danificadas). Depende 100% da via das pentoses p/ manter a glutationa e o ferro da
#       hemoglobina reduzido (Fe2+). Se o NADPH falha, a hemoglobina oxida e precipita (corpos
#       de Heinz), a membrana é danificada e a célula hemolisa. [fig slide-27 glutationa na hemácia 60%]
#   3.4 Deficiência de G6PD: enzimopatia mais comum do mundo (~400 milhões de pessoas). Em
#       repouso a hemácia se vira; sob ESTRESSE OXIDATIVO (fármacos como primaquina/dapsona/
#       sulfas, infecção, favas — favismo) a demanda de NADPH dispara, o escudo não recarrega
#       e vem a HEMÓLISE aguda. Ligada ao X (afeta mais homens). A mesma fragilidade da
#       membrana dá RESISTÊNCIA à malária (Plasmodium falciparum não completa o ciclo na
#       hemácia frágil) — por isso a mutação é frequente em áreas de malária endêmica.
#       [reaproveita slide-41/27; clínica inline]
#
# Figuras planejadas (>=3 por PARTE): I=3 (slide-08, slide-33, slide-09) · II=4 (slide-16,
#   slide-49, slide-18, slide-51) · III=3 (slide-39, slide-41, slide-27). Total 10. slide-45
#   (reações listadas em texto) e slide-44 (glutationa redundante com 41) DESCARTADOS pelo
#   filtro de utilidade. Relatório auditável no fechamento.

