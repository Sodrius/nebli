# ---------------------------------------------------------------------------
# SEÇÃO B.ter — Pré-requisitos cruzados com frase-âncora pronta
# ---------------------------------------------------------------------------
# - glicólise: "sequência que quebra a glicose em piruvato no citosol, rende ATP e NADH, e
#     passa por intermediários (glicose-6-P, frutose-6-P, gliceraldeído-3-P) que a via das
#     pentoses também usa"
# - NADH/cadeia respiratória: "o NADH gerado no catabolismo entrega elétrons à cadeia
#     respiratória na mitocôndria para fabricar ATP — é a moeda da produção de energia"
# - nucleotídeo: "a unidade que forma DNA e RNA: uma base nitrogenada + um açúcar de 5
#     carbonos (a ribose) + fosfato; a ribose vem da via das pentoses"
# - inibição por produto / alostérica: "quando o próprio produto de uma via se liga à
#     enzima controladora e a desliga, a célula evita fabricar o que já tem de sobra"
# - hemácia: "o glóbulo vermelho é uma célula sem núcleo e sem mitocôndria, cheia de
#     hemoglobina; não fabrica proteínas novas nem produz ATP/NADPH pela mitocôndria"
# - ligado ao X: "gene que fica no cromossomo X; como o homem tem um X só, uma cópia
#     defeituosa já o afeta, enquanto a mulher costuma ter a segunda cópia para compensar"

# ---------------------------------------------------------------------------
# SEÇÃO C — Termo-notas obrigatórios (6-10)
# ---------------------------------------------------------------------------
# poder redutor · ribose-5-fosfato · anabolismo/biossíntese redutora · inibição por produto ·
# espécie reativa de oxigênio · superóxido · glutationa · corpos de Heinz · hemólise ·
# enzimopatia · favismo · transcetolase · transaldolase
# Siglas (#sigla na 1a): NADPH · NADP+ · NADH · NAD+ · G6P · G6PD · ATP · CO2 · GSH · GSSG ·
# ERO · DNA · RNA · CoA · F6P · G3P

# ---------------------------------------------------------------------------
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo)
# ---------------------------------------------------------------------------
# - Quebra: confundir a G6PD (enzima da via das pentoses) com a glicose-6-fosfato (G6P,
#     intermediário compartilhado).
#   Correção: G6P é o AÇÚCAR de partida; a G6PD é a ENZIMA que o oxida a 6-fosfogliconato
#     gerando NADPH. A G6PD não participa da glicólise — quem falha na deficiência é a defesa
#     antioxidante, não a produção de ATP glicolítico. (banco NEBLI 0266)
# - Quebra: achar que NADPH e NADH são intercambiáveis por serem "quase iguais".
#   Correção: têm papéis opostos — NADH ALIMENTA a cadeia respiratória (produz ATP, é da
#     oxidação); NADPH DOA elétrons para construir (síntese de lipídios) e para regenerar a
#     glutationa (defesa). O fosfato extra é a etiqueta que separa os dois estoques. (banco NEBLI 0267)
# - Quebra: inverter o que cada fase faz.
#   Correção: a fase OXIDATIVA produz NADPH + ribose + CO2 e é irreversível; a fase
#     NÃO-OXIDATIVA só remonta açúcares (F6P, G3P) de forma reversível e NÃO gera NADPH. Só
#     NADPH → oxidativa; só ribose → não-oxidativa a partir de F6P/G3P. (banco NEBLI 0268)
# - Quebra: pensar que a célula sempre roda a via inteira do começo ao fim.
#   Correção: a célula liga o ramo conforme a demanda — em divisão celular usa só a
#     não-oxidativa (quer ribose, não NADPH); na lipogênese roda os dois para maximizar
#     NADPH e reciclar a ribose. O custo de rodar só a não-oxidativa é apenas 1 ATP da
#     hexoquinase. (banco NEBLI 291)
# - Quebra: supor que a G6PD é regulada "de fora", por hormônio.
#   Correção: o controle principal é interno e imediato — NADP+ ativa a G6PD, NADPH a inibe;
#     a razão NADPH/NADP+ é o sensor. A via se desliga sozinha quando o poder redutor está
#     alto. (slide-51)
# - Quebra: achar que a deficiência de G6PD causa hemólise o tempo todo.
#   Correção: em repouso a hemácia se mantém; a crise vem quando um OXIDANTE (primaquina,
#     sulfas, infecção, favas) dispara a demanda de NADPH que a enzima deficiente não supre
#     — aí a glutationa não recarrega, a hemoglobina oxida (corpos de Heinz) e a célula
#     rompe. (armadilha clínica)
# - Quebra: tratar a resistência à malária como coincidência.
#   Correção: a mesma fragilidade da membrana da hemácia deficiente de G6PD atrapalha o
#     ciclo do Plasmodium falciparum dentro dela — por isso a mutação persiste em áreas de
#     malária endêmica (vantagem seletiva). (slide-43)

# ---------------------------------------------------------------------------
# SEÇÃO E — Exemplares-âncora
# ---------------------------------------------------------------------------
# Cat 1 (mecanismo parágrafo-a-parágrafo, universal) → fio "a via das pentoses fabrica
#   INSUMOS de construção (NADPH + ribose), não energia" costura as 3 PARTES.
# Cat 6 (organização terminológica) → NADPH vs NADH; fase oxidativa vs não-oxidativa;
#   GSH vs GSSG. Diferenciar sem virar lista seca.
# Cat 7 (analogia construtiva, parcimônia) → NADPH como "bateria de construção" separada da
#   "bateria de energia" (NADH); glutationa como "escudo" que o NADPH recarrega; G6PD como
#   "termostato" da via. 1 por subtópico onde couber.
# Cat 4 (magnitudes ancoradas) → ~20% da glicose pela via; ~0,2% do O2 vira superóxido
#   (~400 g/ano); ~400 milhões com deficiência de G6PD.
# Cat 9 (clinica-box, cadeia 4-6 linhas) → crise hemolítica por G6PD (oxidante → escudo
#   descarregado → corpos de Heinz → hemólise). 1 na PARTE III.
# Cat 8 (atencao-box, parcimônia 1-2/PARTE) → inversões com peso: G6P≠G6PD; NADPH≠NADH;
