# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Blueprint = ALTO rendimento.
#   Fio mecanístico único: a via das pentoses é a resposta da célula a duas necessidades
#   que a glicólise NÃO atende — poder redutor para CONSTRUIR (NADPH) e o açúcar de 5
#   carbonos para fazer material genético (ribose-5-P). A aula inteira mostra (1) o que a
#   via entrega, (2) como ela se divide em duas fases que a célula liga conforme a demanda,
#   e (3) por que, sem o NADPH dela, a hemácia se rompe sob estresse oxidativo (deficiência
#   de G6PD). Integração natural: pentoses×glicólise (compartilham G6P, F6P, G3P);
#   NADPH×lipogênese; ribose×síntese de nucleotídeos; NADPH×glutationa×radicais livres.
# Blueprint (ALTO): aprofundar com 1-2 frases de mecanismo — G6PD como passo controlador
#   inibido por NADPH; glutationa regenerada pela glutationa redutase à custa de NADPH;
#   por que a HEMÁCIA (sem mitocôndria, sem outra fonte de NADPH) é a mais vulnerável.
#   Ângulo E2/E3 de Aplicação: deficiência de G6PD → hemólise desencadeada por oxidante
#   (favismo, primaquina, infecção); resistência à malária. Gancho clínico invisível:
#   anemia hemolítica por oxidante. Fonte invisível — nunca citar "Step 1/residência/USMLE".
# Alvo de páginas E1: piso 2, TETO 22 (alvo 14-18 — tema denso mas de fio único claro).
# Recorte: 1 slide da aula "Via das Pentoses" (56 páginas). O slide cobre EXATAMENTE o
#   tema pedido — via das pentoses + radicais livres. Vai da caracterização geral (destinos
#   da glicose, dois produtos) à fase oxidativa, fase não-oxidativa, regulação, e fecha em
#   NADPH/glutationa/G6PD/favismo/malária. Cobrir o arco todo, com PESO no núcleo
#   ALTO-rendimento (NADPH×G6PD×glutationa×hemólise). A química fina da fase não-oxidativa
#   (todos os intermediários de 4-7 C) entra como PANORAMA, não como decoreba reação-a-reação.
#
# Prioridades desta corrida (Diário de revisões + pedido):
#   P1. Diário biocel-07 (peso alto): NÃO fechar cadeia multi-passo sem figura. Fase
#       oxidativa (4 reações) + conexão com glicólise = figura OBRIGATÓRIA → slide-16.
#       Fase não-oxidativa (remontagem de carbono) → slide-18/49. 9 figuras (3 por PARTE),
#       todas do slide do professor.
#   P2. Sem pergunta-âncora/retórica de abertura (canônico 2026-05-29). Abertura =
#       afirmação direta + mecanismo. Os 5 registros rotacionados.
#   P3. Prosa fluida, NUNCA rajada de siglas (canônico 2026-05-29). NADPH/NADP+/G6PD/GSH/
#       GSSG/ERO entram dentro de frase com sujeito+verbo+complemento — a distinção
#       NADPH≠NADH é conceito, não par de siglas coladas.
#   P4. E2: ~10 C/E (cada um 4 itens I-IV, gate hard) nas 3 categorias + 2-3 "assinale a
#       incorreta"; gabarito sorteado + guarda anti-degeneração; paridade banda dupla
