# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Tema descritivo-histológico com
#   núcleo mecanístico real (acoplamento excitação-contração; CICR no cardíaco;
#   via da calmodulina/MLCK no liso). Integração natural: estrutura×função,
#   tipo de músculo×mecanismo de cálcio, histologia×reconhecimento ao microscópio.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 15-18).
# Recorte (declarado a pedido de Davi): PARTES I e II = "geralzão" extraído do
#   deck principal "Tecido muscular - slides.pdf" (estrutura + contração + os 3
#   tipos). PARTE III = SOMENTE prática — identificar os 3 tecidos ao microscópio
#   (HE), extraída de "Tecido muscular - slides - aula prática.pdf". Sem ambiguidade
#   de recorte: cada deck alimenta seu bloco.
#
# Prioridades desta corrida (do pedido literal de Davi + Diário de revisões):
#   P1. Usar TABELA onde a tabela rende (comparação dos 3 tipos = Cat 16 + Cat 18
#       gatilho 3, caso (a) do CLAUDE.md) e TÓPICO onde cabe (critérios de
#       reconhecimento ao microscópio na PARTE III = Cat 18 gatilho 1, caso (c)
#       critérios diagnósticos discretos). Resto = prosa expositiva contínua.
#   P2. PARTE III é PRÁTICA pura: "como reconhecer", não nova teoria. Cada tipo
#       ganha um checklist de reconhecimento ancorado numa micrografia HE real.
#   P3. Diário (biocel-07, peso alto): tema espacial → figura obrigatória. Aqui há
#       decks ricos (hierarquia do sarcômero, tríade, micrografias) — usar de fato.
#   P4. Nomes de subtópico diretos e informativos (item 35), não poéticos.
#   P5. E2: ~10 C/E nas 3 categorias + 2-3 "assinale a incorreta"; gabarito
#       sorteado de verdade + guarda anti-degeneração; paridade banda dupla Q01-Q30.
#   P6. Sem pergunta-âncora/retórica de abertura (canônico 2026-05-29).

