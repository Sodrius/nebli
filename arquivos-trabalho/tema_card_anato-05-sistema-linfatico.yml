# ===========================================================================
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ===========================================================================
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Tema anatômico-descritivo, mas
#   com UM fio mecanístico que amarra tudo: o sistema linfático existe para
#   RECOLHER o líquido que escapa do capilar sanguíneo e DEevolvê-lo à veia,
#   filtrando-o no caminho. Toda estrutura serve a esse fluxo de mão única e
#   baixa pressão: capilar de fundo cego com mini-válvulas (entra, não sai);
#   válvulas ao longo dos vasos (sobe, não desce); linfonodo estrangulado
#   (aferente numeroso → eferente único = fluxo lento = tempo de filtragem);
#   propulsão sem bomba central (musculatura da parede + bomba muscular +
#   bomba respiratória); convergência troncos → ductos → ângulo venoso.
# Recorte: SLIDE Parte 2 (sistema linfático) da Aula 5. A Parte 1 (coração e
#   grandes vasos, 44 slides) NÃO entra — é resumo à parte, pendente do PDF.
#   Este resumo é honestamente "Sistema Linfático (Anatomia)", não o anato-05
#   inteiro. Histologia fina de vaso/linfonodo ao microscópio é do histo-09;
#   aqui a parede entra só o suficiente para explicar a função.
# Blueprint (anatomia macro imuno-linfática, rendimento MÉDIO): ganchos clínicos
#   leves inline só onde o anatômico pede — linfedema (falha de drenagem),
#   metástase linfonodal e esvaziamento axilar no câncer de mama, quilotórax
#   (lesão do ducto torácico), linfonodo palpável (linfadenopatia). Sem box
#   clínico pesado; 1-2 clínica-box no máximo por PARTE.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 11-14 — tema de um slide só, direto
#   e fluido, cobrindo 100% do conteúdo com folga de mecanismo).
#
# Prioridades desta corrida (do § Diário de revisões + pedido literal):
#   P1. Tema ESPACIAL → figura é obrigatória (Diário biocel-07, peso alto). Usar
#       de fato os slides rotulados: circulação linfática, capilar, linfonodo,
#       troncos, ductos, cisterna do quilo, ângulo venoso.
#   P2. Prosa expositiva de monitor; abertura = afirmação direta + mecanismo
#       (sem pergunta-âncora/retórica — canônico 2026-05-29).
#   P3. E2: ~10 C/E (cada um 4 itens I-IV, gate hard) nas 3 categorias + 2-3
#       "assinale a incorreta"; gabarito sorteado + guarda anti-degeneração;
#       paridade banda dupla 0.80-1.25 Q01-Q30; cada subtópico testado >=2x.
#   P4. Fluidez vence checklist; sem rajada de siglas (a maioria do jargão aqui
#       é nome anatômico, não sigla — MALT é a principal sigla).

