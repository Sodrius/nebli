#   mama→axila (58%) · slide-13 mapa torácico de nódulos (55%)
# PARTE III: slide-07 propulsão + bomba respiratória (65%) · slide-13 troncos
#   torácicos (58%) · slide-14 cisterna do quilo/ducto torácico (54%) · slide-17
#   ângulos venosos direito/esquerdo (54%)

# ===========================================================================
# SEÇÃO B.bis — Registro de abertura por subtópico (sem repetir vizinho)
# ===========================================================================
# 1.1 enquadramento | 1.2 integração-posterior | 1.3 ponto-de-quebra (entra e não volta)
# 2.1 enquadramento | 2.2 analogia concreta (pedágio/filtro) | 2.3 integração-anterior | 2.4 integração-posterior
# 3.1 ponto-de-quebra (não há coração no linfático) | 3.2 integração-anterior | 3.3 analogia concreta (afluentes→rio→foz)

# ===========================================================================
# SEÇÃO B.ter — Pré-requisitos cruzados com frase-âncora pronta
# ===========================================================================
# - líquido intersticial: "o líquido que banha as células, filtrado do plasma nos capilares sanguíneos; sobra um pouco a cada ciclo, e é essa sobra que o linfático recolhe"
# - linfócito B e T: "glóbulos brancos da imunidade adquirida; o B fabrica anticorpos, o T coordena e mata células infectadas"
# - gradiente de pressão: "líquido só anda de onde a pressão é maior para onde é menor; uma válvula de mão única deixa passar num sentido e trava no outro"
# - capilar sanguíneo: "o vaso mais fino, onde o sangue troca gases e nutrientes com o tecido; é dele que o plasma extravasa para o interstício"

# ===========================================================================
# SEÇÃO C — Termo-notas obrigatórios (6-10)
# ===========================================================================
# linfa · líquido intersticial · quilo · vaso lactífero · filamentos de fixação
# linfonodo · seio linfático · vaso aferente · vaso eferente · cisterna do quilo
# ducto torácico · ângulo venoso · MALT · anel de Waldeyer · placa de Peyer

# ===========================================================================
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo)
# ===========================================================================
# - Quebra: achar que o linfático é um circuito fechado como o sanguíneo.
#   Correção: é uma via de MÃO ÚNICA e ABERTA numa ponta — começa em fundo cego no
#     tecido, recolhe líquido e devolve à veia; não tem volta, não faz circuito. (slide-04)
# - Quebra: imaginar que a linfa entra no capilar por pressão, empurrada.
#   Correção: as células endoteliais sobrepostas funcionam como mini-válvulas; quando
#     o interstício incha, os filamentos de fixação puxam e ABREM as fendas — o líquido
#     entra, e ao subir a pressão dentro do vaso a fenda fecha e ele não sai. (slide-05)
# - Quebra: supor que a linfa sobe empurrada por um coração linfático.
#   Correção: não há bomba central; a linfa sobe pela contração da musculatura lisa da
#     própria parede + válvulas + compressão externa (bomba muscular esquelética e
#     bomba respiratória pelo jogo de pressões torácica/abdominal). (slide-07)
# - Quebra: pensar que o linfonodo tem um vaso que entra e um que sai, iguais.
#   Correção: VÁRIOS aferentes entram pela convexidade e UM (ou poucos) eferente sai pelo
#     hilo; esse estrangulamento faz a linfa passar devagar pelos seios, dando tempo aos
#     macrófagos de filtrar antígenos. (slide-09)
# - Quebra: achar que o ducto torácico drena o corpo todo por igual.
#   Correção: o ducto torácico drena TUDO menos o quadrante superior DIREITO (cabeça/pescoço
#     D, membro superior D, hemitórax D) — esse quadrante cai no ducto linfático direito. (slide-16/17)
# - Quebra: confundir órgão linfoide primário com secundário.
#   Correção: primário é onde o linfócito NASCE/AMADURECE sem antígeno (medula óssea e timo);
#     secundário é onde ele ENCONTRA o antígeno e responde (linfonodo, baço, MALT). (slide-18/19)
# - Quebra: tratar todo tecido como drenável pelo linfático.
#   Correção: há tecidos avasculares para o linfático — cartilagem, epiderme, córnea, SNC,
#     partes do baço e da medula óssea; neles o excesso é resolvido por outra via. (slide-08)

# ===========================================================================
# SEÇÃO E — Exemplares-âncora
# ===========================================================================
# Cat 1 (mecanismo parágrafo-a-parágrafo) → estrutura no 1º parágrafo, função no 2º
#   (modelo Exemplar 1.2 sinapse elétrica): capilar linfático (arquitetura → mão única);
#   linfonodo (forma estrangulada → filtragem lenta).
# Cat 7 (analogia construtiva, parcimônia) → linfonodo como pedágio que afunila o trânsito;
#   troncos→ductos como afluentes→rio→foz na veia; capilar de fundo cego como ralo com tampa
#   de mão única. 1 por subtópico onde pedir, nunca forçada.
# Cat 8 (atencao-box) parcimônia → reservar vermelho p/ inversão com peso clínico
#   (ducto torácico drena tudo MENOS quadrante sup D → erro de lado no quilotórax/dissecção).
#   Resto vira confusao-prevista (gold) ou prosa dialogada.
# Cat 15 (#figura-lateral) → onde texto curto + figura pequena (órgãos primários; ângulo venoso).
# Cat 14 (siglas footnote) → MALT única sigla real recorrente; SNC pontual. Sem rajada.

