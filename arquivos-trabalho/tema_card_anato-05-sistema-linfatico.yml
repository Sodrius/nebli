# ===========================================================================
# SEÇÃO B — Figuras planejadas (>=3 por PARTE)
# ===========================================================================
# PARTE I : slide-04 circulação linfática (mapa geral, 70%) · slide-05 capilar de
#   fundo cego + filamentos de fixação (60%) · slide-10 drenagem do membro inf
