# ---------------------------------------------------------------------------
# SEÇÃO B — Esqueleto das 3 PARTES + figuras planejadas
# ---------------------------------------------------------------------------
# PARTE I (RT: funções, componentes, hematopoiéticos, lados, mediastino, pericárdio, externo)
#   1.1 Funções (nutrir/oxigenar, remover resíduos, carrear células imunes) + componentes
#       (cardiovascular = coração+vasos; hematopoiéticos = medula/baço/fígado; linfático) +
#       sistema FECHADO (coração→artéria→capilar→veia→retorno)  [fig slide-05 sistema fechado, 60%]
#   1.2 Bomba dupla: lado direito (desoxigenado→pulmão = pequena circulação) × esquerdo
#       (oxigenado→corpo = grande/sistêmica); tipos de circulação; inversão art/venoso na
#       pulmonar; trajeto do sangue venoso na pulmonar  [fig slide-07 anatomia dos vasos, 55%]
#   1.3 Localização: tórax, mediastino MÉDIO; divisões (sup/inf → ant/médio/post); 1/3 D 2/3 E;
#       tamanho ~12x9x6 cm, 250-350 g; base sup/ápice inf  [fig slide-23 mediastino, 55%]
#   1.4 Superfície externa: base/ápice; faces esternocostal(VD)/diafragmática(VE-VD)/pulmonares;
#       margens; sulcos coronário + interventriculares ant/post; aurículas  [fig slide-25 posição/faces, 65%]
#   1.5 Pericárdio: fibroso (conjuntivo denso inelástico, lig. pericardicofrênico, funde aos
#       grandes vasos) + seroso (parietal + visceral/epicárdio) + cavidade/líquido; função:
#       liberdade de movimento + ancoragem  [fig slide-30 pericárdio seroso, 65%]
# PARTE II (RT+RP: câmaras, septos, camadas, aparelho valvar, valvas, ciclo, esqueleto, coronárias)
#   2.1 Câmaras: átrios receptores/superiores (+aurículas, mm pectíneos) × ventrículos
#       bombeadores/inferiores; parede VE>VD; septos interatrial + interventricular; bomba dupla
#       [fig slide-33 anatomia externa ant/post — câmaras/septos/sulcos, 72%]
#   2.2 Camadas da parede: endocárdio (reveste câmaras+valvas) / miocárdio (95%) / epicárdio;
#       aparelho interno do ventrículo: trabéculas cárneas + mm papilares (miocárdio) + cordas
#       tendíneas (conjuntivo)  [fig slide-36 aparelho ventricular, 55%]
#   2.3 Valvas AV: impedem refluxo V→A; tricúspide (AD-VD, 3 cúspides) × bicúspide/mitral
#       (AE-VE, 2 cúspides); aparelho valvar cúspide+corda+papilar (paraquedas); fecham na sístole
#       [fig slide-40 valvas AV, 65%]
#   2.4 Valvas semilunares: pulmonar (VD-tronco pulmonar) + aórtica (VE-aorta); 3 válvulas
#       semilunares em ninho, sem cordas; abrem quando P(ventrículo)>P(artéria); óstios coronários
#       atrás das válvulas aórticas; sístole abre semilunares / diástole abre AV  [fig slide-42 sístole/diástole plano valvar, 60%]
#   2.5 Esqueleto fibroso: 4 anéis de conjuntivo denso; fixa valvas, evita dilatação das aberturas,
#       isola átrios de ventrículos (base p/ condução); + irrigação própria: coronárias D/E dos
#       óstios aórticos → sulcos → seio coronário (drenagem venosa no AD)  [fig slide-44 esqueleto fibroso, 65%]
# PARTE III (RT+RP: grandes vasos, artéria/veia/capilar, microcirc, retorno, linfático)
#   3.1 Grandes vasos da base: aorta (asc→arco→desc) + ramos do arco (tronco braquiocefálico →
#       carótida comum D + subclávia D; carótida comum E; subclávia E); tronco pulmonar → aa
#       pulmonares; VCS+VCI (retorno sistêmico); vv pulmonares (retorno oxigenado ao AE)  [fig slide-33 grandes vasos, 68%]
#   3.2 Vasos: artéria (leva p/ fora, ramifica) × veia (traz p/ dentro, converge); 3 túnicas
#       (íntima/média/adventícia); classificação artérias condução-elásticas/distribuição-musculares/
#       arteríolas; capilares contínuo/fenestrado/sinusoide (breve — histo aprofunda)  [fig slide-08 túnicas, 60%]
#   3.3 Microcirculação: meta-arteríola→capilar→vênula pós-capilar; esfíncteres pré-capilares
#       relaxados (perfunde leito) × contraídos (canal de escoamento shunta); vasomotricidade;
#       comunicações AV (microcirc, anastomose AV/termorregulação, glomérulo, circulação porta)  [fig slide-14 esfíncteres, 68%]
#   3.4 Veias e retorno de baixa pressão: 64% do volume; classificação; válvulas venosas; bomba
#       muscular esquelética ("2º coração") + bomba arteriovenosa; veias acompanhantes;
#       comunicantes/perfurantes (superficial→profunda)  [fig slide-16 válvulas venosas, 58%]
#   3.5 Sistema linfático: 3 elementos (linfa+vasos+linfócitos/órgãos); funções (drenar líquido
#       intersticial, transportar lipídios/quilo via vasos lácteos, imune); órgãos primários
#       (medula, timo) × secundários (linfonodos, baço, MALT); capilares linfáticos fundo cego;
#       troncos→ductos (torácico + cisterna do quilo drena tudo menos quadrante sup D; ducto
#       linfático direito); transporte (musc lisa + bomba muscular + bomba respiratória);
#       desemboca no ângulo jugulo-subclávio  [fig p2-slide-12 circulação linfática, 62%; p2-slide-10 ductos, 60%]
#
# Figuras planejadas (>=3 por PARTE): I=5 · II=5 · III=6. Relatório no fechamento.

# ---------------------------------------------------------------------------
# SEÇÃO B.bis — Registro de abertura por subtópico (sem repetir vizinho)
# ---------------------------------------------------------------------------
# 1.1 enquadramento | 1.2 ponto-de-quebra (o mesmo "sangue" muda de identidade) | 1.3 integração-anterior | 1.4 analogia concreta (mapa de superfície) | 1.5 integração-posterior
# 2.1 enquadramento | 2.2 integração-anterior | 2.3 analogia concreta (paraquedas) | 2.4 ponto-de-quebra (semilunar não tem corda) | 2.5 integração-posterior
# 3.1 enquadramento | 3.2 integração-anterior | 3.3 analogia concreta (torneira) | 3.4 ponto-de-quebra (o retorno não tem pressão do coração) | 3.5 integração-posterior
# Nenhum par vizinho compartilha registro.

# ---------------------------------------------------------------------------
# SEÇÃO B.ter — Pré-requisitos cruzados com frase-âncora pronta
# ---------------------------------------------------------------------------
# - sangue oxigenado × desoxigenado: "sangue oxigenado é o que já passou pelo pulmão e carrega O2; desoxigenado é o que voltou dos tecidos e precisa ser reoxigenado"
# - músculo estriado cardíaco: "músculo involuntário, estriado, que se contrai sozinho em ritmo próprio — só existe no coração"
# - gradiente de pressão: "líquido só se move de onde a pressão é maior para onde é menor; a valva abre ou fecha conforme de que lado a pressão está maior"
# - tecido conjuntivo denso: "malha resistente e pouco elástica de fibras colágenas — serve para fixar e sustentar, não para esticar"
# - líquido intersticial: "o líquido que banha as células no espaço entre elas, filtrado do sangue nos capilares"

# ---------------------------------------------------------------------------
# SEÇÃO C — Termo-notas obrigatórios (6-10)
# ---------------------------------------------------------------------------
# mediastino · pericárdio · epicárdio · miocárdio · endocárdio · aurícula · mm. pectíneos
# trabéculas cárneas · músculos papilares · cordas tendíneas · valva semilunar · esqueleto fibroso
# seio coronário · anastomose arteriovenosa · esfíncter pré-capilar · linfa · cisterna do quilo · MALT

# ---------------------------------------------------------------------------
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo)
# ---------------------------------------------------------------------------
# - Quebra: achar que artéria = sangue oxigenado e veia = desoxigenado sempre.
#   Correção: artéria/veia se define pela DIREÇÃO (artéria sai do coração, veia volta), não pelo O2;
#     na circulação pulmonar a artéria pulmonar leva sangue DESoxigenado e as veias pulmonares trazem
#     OXIgenado — a regra do oxigênio se inverte. (RT)
# - Quebra: confundir face pulmonar direita com o ventrículo direito.
#   Correção: a face/margem pulmonar direita é formada pelo ÁTRIO direito; o ventrículo direito forma a
#     face esternocostal (anterior). (q-0356)
# - Quebra: pensar que na sístole ventricular as valvas AV se abrem para o sangue sair.
#   Correção: na sístole ventricular abrem-se as SEMILUNARES (pulmonar e aórtica) e FECHAM as AV; o sangue
#     sai pelas artérias, não volta aos átrios. (q-0357)
# - Quebra: dar cordas tendíneas às valvas semilunares.
#   Correção: só as valvas ATRIOVENTRICULARES têm cordas tendíneas + músculos papilares; as semilunares
#     funcionam passivamente pelo formato em ninho, sem corda nenhuma. (RT)
# - Quebra: achar que o tronco braquiocefálico existe dos dois lados.
#   Correção: o tronco braquiocefálico é só do lado DIREITO e origina a carótida comum direita + subclávia
#     direita; à esquerda, carótida comum e subclávia saem direto do arco da aorta. (q-0358)
# - Quebra: supor que o retorno venoso é empurrado pela pressão do coração.
#   Correção: no retorno a pressão do coração já se dissipou; o sangue volta pela bomba muscular esquelética
#     e pela bomba respiratória, e as válvulas venosas impedem que ele reflua. (slide-16/17)
# - Quebra: imaginar que o ducto torácico drena o corpo todo por igual.
#   Correção: o ducto torácico drena TUDO menos o quadrante superior DIREITO (esse cai no ducto linfático
#     direito); a cisterna do quilo é a base dilatada do ducto torácico. (slide p2-08/09)
# - Quebra: tratar o esqueleto fibroso como um osso do coração.
#   Correção: é tecido conjuntivo denso (não osso) que fixa as 4 valvas, evita dilatação das aberturas e
#     isola eletricamente os átrios dos ventrículos. (slide-44)

# ---------------------------------------------------------------------------
# SEÇÃO E — Exemplares-âncora
# ---------------------------------------------------------------------------
# Cat 1 (mecanismo parágrafo-a-parágrafo) → "forma serve a fluxo sob pressão" como fio das 3 PARTES.
# Cat 7 (analogia construtiva, parcimônia) → valva AV como paraquedas (cordas+papilar seguram); esqueleto
#   fibroso como moldura de porta; esfíncter pré-capilar como torneira. 1 por subtópico onde pedir.
# Cat 16/18 (catálogo com traço definidor) → TABELA onde couber: lado D×E; 3 camadas da parede;
#   AV×semilunar; ductos torácico×linfático direito. Resto = prosa.
# Cat 8 (atencao-box) parcimônia → 1-2 por PARTE; reservar p/ inversão letal (art/veia pulmonar;
#   sístole abre semilunar; tamponamento). Resto vira confusao-prevista (gold) ou prosa dialogada.
# Cat 15 (#figura-lateral) → onde texto curto + figura pequena (aurícula/mm pectíneos; válvula venosa).
# Cat 14 (siglas footnote) → VCS/VCI/AD/VD/AE/VE/MALT com parcimônia; foco em prosa, sem rajada de sigla.

