# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Tema anatômico-descritivo, mas
#   com fio mecanístico que amarra tudo: a FORMA de cada estrutura serve a um FLUXO
#   sob pressão. Bomba dupla (D baixa pressão/pulmonar, E alta pressão/sistêmica) →
#   parede VE > VD; valvas = portas de mão única que dependem de gradiente de pressão;
#   retorno venoso de baixa pressão precisa de válvulas + bombas externas; linfático
#   recolhe o que vaza. Integração natural: câmara×pressão, valva×ciclo, esqueleto
#   fibroso×elétrico, coronária×sulco, linfático×imune.
# Blueprint (BAIXO / anatomia macro): NÃO forçar clínica. Ganchos leves inline só
#   quando o próprio anatômico pede (tamponamento no pericárdio inelástico; sopro na
#   valva; infarto e território coronário; linfedema/metástase linfonodal). Sem box
#   clínico pesado.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 18-22 — Davi pediu generoso em páginas,
#   desde que direto e fluido; cobrir 100% dos 4 materiais).
# Recorte: DOIS slides da Profa. Katiúcia (Parte 1 = 44 pág; Parte 2 = 17 pág, linfático)
#   + Roteiro Teórico (RT, ~60 perguntas) + Roteiro Prático (RP, estruturas de bancada).
#   Slide cobre anatomia MACRO de coração + vasos + linfático. A HISTOLOGIA fina da
#   parede (fotomicrografia, tipos de capilar ao microscópio) é do histo-09 — aqui a
#   parede entra só o suficiente para explicar função. Fisiologia elétrica/ciclo
#   detalhado NÃO é foco (fica com fisiologia); entra só o essencial das valvas.
#
# Prioridades desta corrida (do pedido literal de Davi):
#   P1. COBRIR TUDO dos 4 materiais. Toda pergunta do RT respondida INDIRETAMENTE na
#       prosa (sem formato pergunta-resposta); toda estrutura do RP nomeada e situada.
#   P2. GENEROSO em páginas na E1, mantendo DIRETO e FLUIDO. Amplo em cobertura, mas
#       cada ponto vai reto ao mecanismo/localização — sem enrolação.
#   P3. INDICAR BEM o deck do AnKing (bloco Onde aprofundar ordenado por completude).
#   P4. Tema muito VISUAL/espacial → usar de fato os slides rotulados da professora
#       (câmaras, valvas, pericárdio, mediastino, ductos). Diário biocel-07 (peso alto):
#       não fechar tema espacial sem figura.
#   P5. Sem pergunta-âncora/retórica de abertura (canônico 2026-05-29). Abertura =
#       afirmação direta + mecanismo/localização.
#   P6. E2: ~10 C/E (cada um com 4 itens I-IV, gate hard) nas 3 categorias + 2-3
#       "assinale a incorreta"; gabarito sorteado + guarda anti-degeneração; paridade
#       banda dupla 0.80-1.25 Q01-Q30; cada subtópico testado >=2x.

