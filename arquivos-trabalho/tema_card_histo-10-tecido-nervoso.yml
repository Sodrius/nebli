# ---------------------------------------------------------------------------
# SEÇÃO B — Esqueleto + figuras planejadas (min 3/PARTE, todas do slide)
# ---------------------------------------------------------------------------
# PARTE I:
#   1.1 Histogênese breve (neuroectoderma→neurônio+macroglia; crista neural→SNP+Schwann+
#       satélite; mesoderma→microglia) + classificação por FORMA (multipolar=maioria,
#       bipolar=retina/olfato/coclear, pseudounipolar=gânglio sensitivo) e por FUNÇÃO
#       (aferente/sensitivo, eferente/motor, interneurônio). [fig slide-04 tipos 60%]
#   1.2 Pericário: núcleo grande eucromático + nucléolo evidente (célula de alta síntese);
#       Nissl=RER+polirribossomos; Golgi; neurofilamentos; lipofuscina (idade). [fig slide-05 60%]
#   1.3 Dendritos (afilam, Nissl, espinhas=plasticidade) × axônio (sai do cone/hillock=zona de
#       gatilho, calibre uniforme, SEM Nissl). Transporte: anterógrado (cinesina→terminal) /
#       retrógrado (dineína→corpo), sobre microtúbulos, gastando ATP. Raiva/tétano pelo
#       retrógrado. [fig slide-07 transporte 66% — CADEIA, OBRIGATÓRIA]
#   1.4 Sinapse: estrutura (botão pré, fenda, membrana pós, vesículas), elétrica (junção gap)
#       × química (maioria), tipos por local (axodendrítica, axossomática, axoaxônica).
#       Panorama funcional em 2-3 frases (PA→Ca²⁺→vesícula→neurotransmissor). [fig slide-09 62%]
# PARTE II:
#   2.1 Astrócito: protoplasmático (cinzenta) × fibroso (branca); pé perivascular → BHE
#       (induz junções oclusivas do endotélio); tampão de K⁺, reciclagem de NT, gliose.
#       [fig slide-11 astrócito/BHE 60%]
#   2.2 Oligodendrócito (1 célula mieliniza VÁRIOS axônios do SNC) × Schwann (1 célula = 1
#       internódulo de 1 axônio do SNP; e envolve fibras amielínicas sem espiralar). Mielina=
#       isolante → condução saltatória nos nós de Ranvier. [fig slide-13 oligo×Schwann 66%;
#       fig slide-14 mielinização/nó/saltatória 70% — CADEIA]
#   2.3 Microglia (mesoderma, fagócito imune do SNC) · ependimárias (revestem ventrículo/canal,
#       cílios; plexo coroide faz liquor) · satélites (envolvem pericário no gânglio).
#       [fig slide-10 panorama da glia + colorações 62%]
# PARTE III:
#   3.1 Cinzenta = pericários + neuropilo; branca = axônios mielinizados (mielina lipídica
#       branqueia). [fig slide-15 branca/cinzenta 58%]
#   3.2 Córtex cerebral (cinzenta externa, 6 camadas, Brodmann=citoarquitetura); cerebelo
#       (molecular/Purkinje/granular; Purkinje=única saída); medula (cinzenta interna em H,
#       canal ependimário). [fig slide-17 cerebelo/Purkinje 55%; fig slide-18 medula 55%]
#   3.3 Nervo periférico: endoneuro/perineuro(barreira)/epineuro, fascículos; gânglio
#       sensitivo (pseudounipolar, sem sinapse) × autônomo (multipolar, com sinapse);
#       meninges (dura/aracnoide/pia) + liquor. [fig slide-21 nervo periférico 66%]
#
# SEÇÃO B.bis — Registro de abertura (rotação, sem vizinho igual):
#   1.1 enquadramento · 1.2 integração-posterior · 1.3 ponto-de-quebra · 1.4 analogia
#   2.1 integração-anterior · 2.2 ponto-de-quebra · 2.3 enquadramento
#   3.1 analogia · 3.2 integração-anterior · 3.3 integração-posterior
#
# SEÇÃO B.ter — Pré-requisitos cruzados (frase-âncora pronta ≤25 palavras):
#   - Tecido conjuntivo: "as bainhas do nervo são tecido conjuntivo — o mesmo material de
#     suporte e condução de vasos que embrulha músculo e osso."
#   - Potencial de ação: "o potencial de ação é a onda de despolarização que corre pela
#     membrana do axônio; aqui só nos interessa por que a estrutura o acelera."
#   - Junção oclusiva (zonula occludens): "junção oclusiva sela o espaço entre células
#     vizinhas, bloqueando a passagem de substâncias pelo meio delas."
#
# SEÇÃO C — Distribuição E2 (PADRÃO): 10 Cons (Q01-10) · 15 Int (Q11-25) · 5 Apl (Q26-30).
#   Formatos: 10 C/E (Q03,06,09,12,15,18,21,24,27,30), 3 "assinale a incorreta" (Q04,14,22),
#   resto MC. Cada C/E com 4 itens I-IV (gate hard). Paridade banda dupla 0.80-1.25 nos MC.
#   Cobertura: cada um dos 10 subtópicos testado >=2x (tabela no fechamento).
#
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo):
#   - Quebra: aluno inverte oligodendrócito e Schwann na conta de axônios mielinizados.
#     Correção: no SNC 1 oligodendrócito serve VÁRIOS axônios; no SNP 1 Schwann faz 1 só
#     internódulo de 1 axônio. (mapa-confusoes C16)
#   - Quebra: aluno atribui a barreira hematoencefálica ao oligodendrócito ou à microglia.
#     Correção: quem a forma é o pé perivascular do astrócito, induzindo junções oclusivas
#     no endotélio. (C13)
#   - Quebra: aluno acha que mielina "conduz melhor" o impulso.
#     Correção: mielina é isolante; força o PA a se regenerar só nos nós — a velocidade vem
#     do salto (condução saltatória), não de conduzir pela bainha. (C18)
#   - Quebra: aluno troca os motores do transporte axonal.
#     Correção: cinesina = anterógrado (ao terminal); dineína = retrógrado (ao corpo). (C10)
#   - Quebra: aluno generaliza "cinzenta é interna".
#     Correção: no córtex a cinzenta é externa; na medula é interna, em H. (C25)
#   - Quebra: aluno acha que toda glia vem do tubo neural.
#     Correção: microglia vem do mesoderma (linhagem de monócito). (C20)
#   - Quebra: aluno procura Nissl no axônio.
#     Correção: Nissl (RER) está no pericário e dendritos, falta no cone e no axônio — é o
#     que distingue os dois na lâmina. (C06)
#   - Quebra: aluno chama todo gânglio de igual.
#     Correção: sensitivo = pseudounipolar sem sinapse; autônomo = multipolar com sinapse. (C29)
#
# SEÇÃO E — Exemplares-âncora:
#   - Cat 17 (cadência dialogal, trecho-modelo de Histologia do Tecido Ósseo): a voz. Abrir
#     por mecanismo, marcar o que importa ("o detalhe que confunde todo mundo é..."),
#     desinflar catálogo em prosa funcional, negrito funcional. É o mesmo gênero.
#   - Cat 18 gatilho 1 (quebrar prosa p/ catálogo de tipos discretos): usar SÓ nos contrastes
#     genuinamente paralelos (tipos de neurônio por forma; camadas do nervo), não em cadeia.
#   - Cat 6 (organização terminológica): glia — nome depois da função.
#   - Cat 11 (distratoras mecanísticas) para a E2; Cat 10/13 para E3 + motivador.

