# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Blueprint = ALTO rendimento.
#   Fio único: o tecido nervoso é o tecido da COMUNICAÇÃO — sua histologia inteira é a
#   solução estrutural para um problema: gerar, conduzir e transmitir sinais a longa
#   distância, rápido e sem vazar. A aula mostra (1) o neurônio, a célula que fala;
#   (2) a glia, o time de apoio sem o qual o neurônio não sobrevive nem conduz depressa;
#   (3) como neurônio + glia se organizam em SNC (córtex, cerebelo, medula) e SNP (nervos,
#   gânglios). Cada estrutura histológica é lida pela função que ela serve.
# Blueprint (ALTO): aprofundar 1-2 frases de mecanismo — oligodendrócito (1 célula,
#   vários axônios do SNC) vs Schwann (1 célula, 1 internódulo do SNP); a barreira
#   hematoencefálica feita pelo pé perivascular do astrócito; a mielina como isolante que
#   gera condução saltatória. Ângulo E2/E3 de Aplicação: desmielinização (Guillain-Barré
#   no SNP × esclerose múltipla no SNC), transporte axonal retrógrado como via da raiva/
#   tétano. Gancho clínico invisível — cenário clínico puro, NUNCA citar Step1/USMLE/
#   residência no PDF.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 15-19 — tema com muito catálogo histológico
#   mas de fio único claro; catálogos entram com quebra-de-prosa controlada, não decoreba).
# Recorte: 1 slide da aula "Histofisiologia do Tecido Nervoso" (22 páginas). O slide cobre
#   EXATAMENTE o tema — neurônio (estrutura/tipos), sinapse (estrutura/tipos), glia
#   (morfologia/função), mielina, e a histologia de medula, córtex cerebral e cerebelo,
#   nervo periférico e gânglios. A FISIOLOGIA fina do potencial de ação (bomba Na/K, canais)
#   aparece no slide mas é de outra aula (Fisiologia) — aqui entra só como PANORAMA de 2-3
#   frases para justificar a estrutura (por que o axônio precisa de mielina), não como
#   núcleo. Foco histológico: o que se vê na lâmina e a função que a forma serve.
#
# Prioridades desta corrida (Diário de revisões + pedido):
#   P1. Diário biocel-07 (peso alto): NÃO fechar cadeia multi-passo sem figura. Transporte
#       axonal (anterógrado/retrógrado) → slide-07. Mielinização + nó de Ranvier + condução
#       saltatória → slide-14. Sinapse passo a passo → slide-09. Todas do slide do professor.
#   P2. Sem pergunta-âncora/retórica de abertura (canônico 2026-05-29). Abertura =
#       afirmação direta + mecanismo. 5 registros rotacionados (Seção B.bis).
#   P3. Prosa fluida, catálogo histológico SEM virar lista-decoreba. Tipos de neurônio,
#       tipos de glia, camadas do nervo: usar quebra-de-prosa controlada (EXEMPLARES Cat 18
#       gatilho 1) só quando o contraste for paralelo; o resto é prosa de mecanismo.
#   P4. E2: ~10 C/E (cada um 4 itens I-IV, gate hard) nas 3 categorias + 3 "assinale a
#       incorreta"; gabarito sorteado + guarda anti-degeneração; paridade banda dupla
#       0.80-1.25 Q01-Q30; cada um dos 10 subtópicos testado >=2x.
#   P5. Bloco Onde aprofundar ordenado por completude, tags reais do export v12.
#   P6. Pedido de Davi: "direto, aprofundado e fluido" — voz da histologia óssea/muscular
#       (EXEMPLARES Cat 17). Fable na sessão.

