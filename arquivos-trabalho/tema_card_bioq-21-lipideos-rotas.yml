# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PROFUNDO (8 Cons · 17 Int · 5 Apl). Tema de fim de P2 (UC02) que
#   amarra β-oxidação, ciclo de Krebs, cadeia respiratória, gliconeogênese, corpos
#   cetônicos e regulação recíproca por insulina/glucagon. Cálculo de rendimento é central.
# Alvo de páginas E1: piso 2, TETO 22 (alvo 16-20 — tema largo, mas coeso).
# Recorte: VALIDADO com Davi (2026-06-25). O slide é uma aula única "Metabolismo de
#   lipídeos" cobrindo rotas (bioq-21) + regulação (bioq-22). Davi pediu UM resumo só,
#   completo, ancorado em bioq-21-lipideos-rotas. A regulação recíproca entra como PARTE III.
#
# Prioridades desta corrida (foco do Davi = "saber aplicar" + aplicar os ajustes de 2026-06-24):
#   P1. CÁLCULO DE ATP em ETAPAS ROTULADAS (item 1/18, modelo Mankiw, anti-padrão A1). É o
#       coração do "saber aplicar": o aluno tem de reproduzir o saldo do palmitato sozinho.
#   P2. Valores P/O do PROFESSOR (NADH=3, FADH2=2, 131 bruto / 129 líquido) como primários;
#       box registrando a convenção moderna (2,5/1,5 → ~106) — calibrar pela autoridade do slide.
#   P3. Abrir cada conceito pelo PROBLEMA/mecanismo, nome técnico depois (anti-padrões A2/A3).
#   P4. Resumindo enxuto: 6-10 seções, ~30-45 palavras de frase encadeada (item 36).
#   P5. Nomes de subtópico diretos, não-poéticos (item 35).
#   P6. Quebrar a prosa SÓ na contabilidade de ATP (tabela = gatilho 3 da Categoria 18) e na
#       comparação β-ox × síntese (gatilho 3); resto é prosa de monitor.
#   P7. E2: ~10 C/E nas 3 categorias + 3 "assinale a incorreta" + 3 questões de cálculo;
#       gabarito sorteado de verdade + guarda anti-degeneração; paridade banda dupla Q01-Q30.
#   P8. Diário (biocel-07): tema com cadeia espacial (carnitina, β-ox 4 passos, lançadeira do
#       citrato, FAS) → figura obrigatória. Slide é rico — usar slides do professor.

