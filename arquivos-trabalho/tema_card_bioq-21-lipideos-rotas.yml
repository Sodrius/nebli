# ---------------------------------------------------------------------------
# SEÇÃO B.ter — Pré-requisitos cruzados com frase-âncora pronta
# ---------------------------------------------------------------------------
# acetil-CoA: "a unidade de 2 carbonos que entra no ciclo de Krebs — moeda comum de
#   carboidrato, gordura e proteína"
# ciclo de Krebs: "as 8 reações na matriz mitocondrial que arrancam elétrons do
#   acetil-CoA, gerando NADH e FADH2"
# cadeia respiratória / fosforilação oxidativa: "onde NADH e FADH2 entregam seus
#   elétrons e o fluxo bombeia prótons que a ATP-sintase usa para fazer ATP"
# AMPc / PKA: "o segundo mensageiro que o glucagon e a adrenalina disparam para
#   fosforilar enzimas e mudar o metabolismo"

# ---------------------------------------------------------------------------
# SEÇÃO C — Termo-notas obrigatórios (6-10)
# ---------------------------------------------------------------------------
# triacilglicerol · lipase hormônio-sensível · carnitina · acil-CoA ·
# β-oxidação (ciclo de Lynen) · corpos cetônicos · malonil-CoA · acetil-CoA carboxilase ·
# sintase de ácidos graxos (FAS) · cetoacidose

# ---------------------------------------------------------------------------
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo, NUNCA voz de prova)
# ---------------------------------------------------------------------------
# - Quebra: tratar "comer pouco carboidrato" como causa única da cetose.
#   Correção: a cetose nasce do excesso de acetil-CoA da β-oxidação somado à falta de
#   oxaloacetato (desviado para a gliconeogênese); dieta rica em gordura + pobre em
#   carboidrato é o contexto clássico. (origem interna: q-0264)
# - Quebra: inverter a ordem das reações da síntese em relação à β-oxidação.
#   Correção: síntese = condensação → redução (NADPH) → desidratação → redução (NADPH);
#   β-oxidação = oxidação (FAD) → hidratação → oxidação (NAD+) → tiólise. São espelhadas
#   na lógica, não idênticas no sentido nem nas coenzimas. (origem interna: q-0265)
# - Quebra: achar que ácido graxo de cadeia par vira glicose.
#   Correção: o acetil-CoA não gera oxaloacetato líquido (piruvato-desidrogenase é
#   irreversível, sem ciclo do glioxilato em mamíferos) — não há síntese líquida de
#   glicose a partir de AG par. Só o glicerol e o propionil-CoA (cadeia ímpar) entram. (origem interna: q-0156)
# - Quebra: somar o ATP da ativação como se fosse 1 ATP.
#   Correção: a ativação consome ATP→AMP + PPi, e o PPi é hidrolisado a 2 Pi — gasto
#   energético equivalente a 2 ligações de alta energia (2 ATP). Por isso 131 bruto − 2 = 129. (origem interna: slide 22)
# - Quebra: achar que a β-oxidação roda sem oxigênio porque "não usa O2 diretamente".
#   Correção: cada volta gera FADH2 e NADH que precisam ser reoxidados na cadeia
#   respiratória; sem O2 final, FAD/NAD+ não se regeneram e o ciclo trava. (origem interna: slide 72)

