# ---------------------------------------------------------------------------
# SEÇÃO B.ter — Pré-requisitos cruzados com frase-âncora pronta
# ---------------------------------------------------------------------------
# glicogênio: "o polímero ramificado de glicose que fígado e músculo guardam como
#   estoque de liberação rápida"
# glicólise: "a sequência citosólica que quebra glicose até piruvato, rendendo ATP"
# gliconeogênese: "a via hepática que fabrica glicose nova a partir de lactato,
#   aminoácidos e glicerol quando o estoque acaba"
# fosforilação de proteína: "acrescentar um grupo fosfato do ATP a uma serina, treonina
#   ou tirosina — muda a forma da proteína e, com ela, sua atividade"
# transcrição: "copiar um gene em RNA mensageiro, primeiro passo para fabricar proteína nova"

# ---------------------------------------------------------------------------
# SEÇÃO C — Termo-notas obrigatórios (6-10)
# ---------------------------------------------------------------------------
# receptor · segundo mensageiro · proteína G trimérica · adenilato-ciclase ·
# peptídeo C · canal de potássio sensível a ATP · glicoquinase · fosfoproteína-fosfatase 1 ·
# fosfodiesterase · desiodinase · elemento responsivo · disruptor endócrino ·
# radioimunoensaio · sulfonilureia
#
# Distribuição da E2 (PADRÃO): Q01-Q10 Consolidação · Q11-Q25 Integração · Q26-Q30 Aplicação.
