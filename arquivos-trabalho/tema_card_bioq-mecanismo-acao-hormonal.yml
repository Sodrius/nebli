# ---------------------------------------------------------------------------
# SEÇÃO D — Pontos de quebra do raciocínio (voz de mecanismo)
# ---------------------------------------------------------------------------
# - Quebra: achar que hormônio lipossolúvel é o único que muda expressão gênica e que
#   hormônio de membrana só muda atividade de enzima já pronta.
#   Correção: a cascata de segundo mensageiro também chega ao núcleo (a PKA fosforila
#   fatores de transcrição); a diferença real é de VELOCIDADE e de onde o receptor mora.
# - Quebra: tratar "amplificação" como sinônimo de "muito hormônio".
#   Correção: a amplificação é numérica e ocorre em cada degrau — um receptor ativa
#   várias proteínas G, cada ciclase faz muitas moléculas de segundo mensageiro.
# - Quebra: inverter o sinal do canal de potássio na célula beta.
#   Correção: o ATP FECHA o canal; fechar impede a saída de potássio, o interior fica
#   menos negativo (despolariza) e o canal de cálcio dependente de voltagem abre.
# - Quebra: dizer que a insulina "abre" o GLUT4.
#   Correção: o GLUT4 já existe, guardado em vesículas; a insulina manda a vesícula
#   fundir com a membrana — o número de transportadores na superfície é que sobe.
# - Quebra: achar que glucagon e adrenalina agem nos mesmos tecidos pelo mesmo receptor.
#   Correção: o músculo não tem receptor de glucagon; quem mobiliza glicogênio muscular
#   é a adrenalina — e a glicose liberada fica no próprio músculo (sem glicose-6-fosfatase).
# - Quebra: chamar T4 de hormônio ativo.
#   Correção: T4 circula como reservatório e é a desiodinase do tecido-alvo que decide
#   ativá-lo em T3 ou inativá-lo em T3 reverso.
# - Quebra: ler a hiperpigmentação da insuficiência adrenal como efeito do cortisol baixo.
#   Correção: sem cortisol não há retroalimentação negativa, a hipófise dispara ACTH, e o
#   fragmento inicial da molécula de ACTH estimula o melanócito.

# ---------------------------------------------------------------------------
