# ---------------------------------------------------------------------------
# SEÇÃO A — Tema · Slug · Alvo · Recorte · Prioridades desta corrida
# ---------------------------------------------------------------------------
# Profundidade: PADRÃO (10 Cons · 15 Int · 5 Apl). Aula ampla de mecanismo de ação
#   hormonal, que costura sinalização celular (receptor, proteína G, segundo mensageiro,
#   receptor nuclear) com metabolismo já visto (glicogênio, glicólise, lipídeos).
# Alvo de páginas E1: piso 2, TETO 22 (alvo 16-20 — aula larga, mas com um único eixo).
# profundidade: padrao   (dial CANON 2026-07-12 — default já elevado)
# Recorte: o slide se chama "Controle Hormonal" e vai de "o que é regulação metabólica"
#   até disruptores endócrinos, passando por insulina, glucagon, catecolaminas,
#   tireoidianos e cortisol. O recorte do resumo é o MECANISMO DE AÇÃO (como o sinal
#   vira resposta), usando cada hormônio como caso concreto — não é uma aula de
#   endocrinologia clínica nem uma revisão do metabolismo do glicogênio em si.
#
# Prioridades desta corrida:
#   P1. Diário (biocel-07, peso alto): tema INTEIRAMENTE feito de cadeias espaciais
#       (cascata do AMPc, secreção da célula beta, receptor nuclear no DNA) → figura
#       obrigatória em toda cadeia multi-passo. O slide é rico em esquemas — usar.
#   P2. Abrir cada subtópico por afirmação direta + mecanismo (pergunta âncora banida).
#   P3. Prosa fluida, nunca rajada de siglas (AMPc/PKA/PP1/GSK3 dentro de frases com
#       sujeito+verbo+complemento — anti-padrão A4).
#   P4. Aprofundamento ≈1 injeção mecanística por subtópico, colada ao mecanismo já
#       aberto (regra-mestra: slide regula O QUE, bibliografia regula ATÉ ONDE).
#   P5. E2: ~10 C/E (sempre 4 itens I-IV) nas três categorias + 3 "assinale a incorreta";
#       paridade banda dupla 0.80-1.25 em Q01-Q30; gabarito sorteado com guarda.
#   P6. Termo-nota nunca repete o termo na prosa (ERROS #20).
#
