termos_nota_obrigatorios:
  - "adipócito — célula altamente diferenciada governada por PPARγ"
  - "lipoblasto — precursor mesenquimal do adipócito"
  - "lâmina basal — colágeno IV + laminina ao redor de cada adipócito"
  - "triacilglicerol — éster glicerol + 3 ácidos graxos; reserva energética"
  - "leptina — adipocina que sinaliza saciedade ao hipotálamo"
  - "adiponectina — adipocina sensibilizadora de insulina"
  - "UCP-1 (termogenina) — canal desacoplador da mitocôndria do marrom"
  - "termogênese sem tremor — calor por dissipação do gradiente de prótons"

# ============================================================
# Seção D — Pontos de quebra
# ============================================================
pontos_quebra:
  - quebra: "A gotícula lipídica do adipócito branco NÃO tem membrana"
    correcao: "Lipídio fica em contato direto com o citosol, estabilizado por capa proteica de perilipina (fosforilável por PKA). Confunde com vesícula envolta por bicamada."
    origem: "Junqueira/Carneiro + livro-texto biocel"
  - quebra: "LPL fica no endotélio, não no adipócito"
    correcao: "Adipócito sintetiza LPL e exporta. Enzima atua no lúmen do capilar ancorada por GPIHBP1. Hidrólise dos TAGs acontece DENTRO da lipoproteína circulante."
    origem: "Lehninger cap. 17"
  - quebra: "UCP-1 não bombeia prótons — é canal de retorno"
    correcao: "Deixa prótons voltarem à matriz sem passar pela ATP-sintase, dissipando gradiente em calor. Ela é o ralo, não a turbina."
    origem: "Lehninger + Kierszenbaum"
  - quebra: "Lipólise no branco não é queima"
    correcao: "Branco hidrolisa e exporta ácidos graxos para músculo/fígado oxidarem. Marrom hidrolisa E oxida na mesma célula."
    origem: "ponto de quebra clássico"
  - quebra: "Cor marrom vem dos citocromos mitocondriais, não do lipídio"
    correcao: "Mitocôndrias abundantes (citocromos a, a3, b, c — grupos heme) + rede capilar densa = aspecto pardo."
    origem: "Ross/Pawlina cap. 9"
  - quebra: "Obesidade hipertrófica vs hiperplásica não é só semântica"
    correcao: "Hipertrófica (adulto): células maiores, número fixo. Hiperplásica (criança): número aumentado pela vida toda. Adultos recuperam peso esvaziando/reenchendo embalagens permanentes."
    origem: "armadilha clínica clássica"
  - quebra: "Marrom em adulto não é vestígio"
    correcao: "PET-FDG 2009 confirmou depósitos ativos em pescoço/supraclavicular. Atividade aumenta com frio crônico. Obesos têm menos UCP-1 funcional."
    origem: "literatura pós-2009"

