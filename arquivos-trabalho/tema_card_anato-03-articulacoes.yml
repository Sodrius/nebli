registros_abertura:
  - subtopico: "1.1"
    registro: enquadramento
    gancho: "Em um corpo com 206 ossos, é tentador imaginar um esqueleto como peças metálicas que se encostam — rígidas no contato. A realidade é diferente..."
  - subtopico: "1.2"
    registro: ponto-de-quebra
    gancho: "O que decide se uma articulação vai ser fixa ou livre? Não é o tipo de osso, nem o tamanho da superfície — é o tipo de tecido que preenche o espaço entre eles e o quanto esse tecido pode se deformar."
  - subtopico: "1.3"
    registro: integração-anterior
    gancho: "Essa relação mobilidade-estabilidade se manifesta de duas formas distintas na classificação — uma olha para o tecido, a outra olha para o movimento."
  - subtopico: "2.1"
    registro: abertura-por-desfazer-confusao
    gancho: "A palavra 'fibrosa' pode sugerir rigidez total — mas o grau de movimento depende do comprimento das fibras, não da presença delas."
  - subtopico: "2.2"
    registro: integração-posterior
    gancho: "Onde as fibrosas usam tecido conjuntivo denso, as cartilagíneas substituem o colágeno por cartilagem — mas o princípio é o mesmo: um intermediário sólido que limita (sem eliminar) o movimento."
  - subtopico: "2.3"
    registro: analogia-concreta
    gancho: "Imagine tentar nutrir um tijolo de cerâmica por dentro — não é possível. A solução é nutrir pela superfície, por difusão, a partir do tecido vizinho."
  - subtopico: "3.1"
    registro: analogia-concreta
    gancho: "A palavra 'sinovial' vem de 'junto ao ovo' — e a metáfora é quase perfeita: uma cápsula que envolve tudo, um fluido viscoso e escorregadio dentro, e superfícies revestidas por um material que desliza sem atrito."
  - subtopico: "3.2"
    registro: enquadramento
    gancho: "Os elementos acessórios não são enfeites — cada um é uma solução anatômica para um problema específico de estabilidade, amortecimento ou congruência."
  - subtopico: "3.3"
    registro: integração-anterior
    gancho: "Estabelecida a estrutura básica, a geometria das superfícies articulares é o que determina quais movimentos são possíveis — e em quantos eixos."
  - subtopico: "3.4"
    registro: ponto-de-quebra
    gancho: "John Hilton, cirurgião britânico do século XIX, percebeu algo que parece óbvio depois de formulado mas nunca havia sido dito: os nervos de uma articulação são os mesmos dos músculos que a movem."

prerequisitos_cruzados:
  - prereq: "Tecido conjuntivo"
    frase: "Tecido conjuntivo é o conjunto de células e matriz extracelular que preenche, sustenta e conecta estruturas — aqui, ele preenche o espaço entre os ossos e define o tipo de articulação."
  - prereq: "Cartilagem hialina vs fibrocartilagem"
    frase: "Cartilagem hialina é translúcida e rica em colágeno II; fibrocartilagem tem feixes densos de colágeno I e é mais resistente à compressão — daí ser usada nos discos intervertebrais."
  - prereq: "Tecido ósseo"
    frase: "O osso é um tecido mineralizado e rígido — por isso não pode se deformar para amortecer impacto; quem faz isso nas articulações é a cartilagem articular."

pontos_de_quebra:
  - quebra: "Classificação estrutural e funcional não se sobrepõem 1:1"
    correcao: "Fibrosas são geralmente sinartroses, mas a sindesmose tibiofibrular é anfiartrose. Toda diartrose é sinovial, mas o critério estrutural e o funcional descrevem a mesma articulação por ângulos diferentes."
  - quebra: "Sinovial ≠ imóvel (inversão clássica)"
    correcao: "Articulações sinoviais são as mais MÓVEIS do corpo — são as diartroses. Sinartroses são as IMÓVEIS (ex: suturas cranianas)."
  - quebra: "Cartilagem articular tem vasos — erro clássico"
    correcao: "A cartilagem articular é avascular e não inervada. A nutrição vem por difusão a partir do líquido sinovial, não de vasos intrínsecos."
  - quebra: "Lâmina epifisial como articulação permanente"
    correcao: "A lâmina epifisial é uma sincondrose TRANSITÓRIA que sofre sinostose ao final do crescimento — não é estrutura permanente."
  - quebra: "Confundir ligamento com tendão"
    correcao: "Ligamento = osso→osso (não contrátil, lesão = entorse). Tendão = músculo→osso (transmite força ativa, lesão = ruptura/distensão)."
  - quebra: "Disco articular = menisco"
    correcao: "Disco articular é completo (divide a cavidade em duas; ex: ATM). Menisco é incompleto/semilunar (não divide; ex: joelho)."

