name: AnkiDroid Manifest

on:
  workflow_dispatch:
  push:
    paths:
      - "flashcards/scripts/gerar_manifesto_ankidroid.py"
      - "flashcards/scripts/validar_deck_card_a_card.py"
      - "flashcards/scripts/derivar_validacao_cards.py"
      - "flashcards/scripts/lint_qualidade_funcional.py"
      - "flashcards/scripts/finalizar_entrega_canonica.py"
      - "flashcards/tests/test_manifesto_*.py"
      - "flashcards/tests/test_release_e1_deck.py"
      - "flashcards/tests/test_validar_deck_card_a_card.py"
      - "flashcards/tests/test_qualidade_funcional_e_modos.py"
      - "flashcards/tests/test_contrato_companion.py"
      - "android-companion/app/src/main/java/com/sodrius/nebli/companion/CardRules.java"
      - "flashcards/scripts/test_pipeline_configuration.py"
      - "config/pipeline.json"
      - ".github/workflows/ankidroid-manifest.yml"
  pull_request:
    paths:
      - "flashcards/scripts/gerar_manifesto_ankidroid.py"
      - "flashcards/scripts/validar_deck_card_a_card.py"
      - "flashcards/scripts/derivar_validacao_cards.py"
      - "flashcards/scripts/lint_qualidade_funcional.py"
      - "flashcards/scripts/finalizar_entrega_canonica.py"
      - "flashcards/tests/test_manifesto_*.py"
      - "flashcards/tests/test_release_e1_deck.py"
      - "flashcards/tests/test_validar_deck_card_a_card.py"
      - "flashcards/tests/test_qualidade_funcional_e_modos.py"
      - "flashcards/tests/test_contrato_companion.py"
      - "android-companion/app/src/main/java/com/sodrius/nebli/companion/CardRules.java"
      - "flashcards/scripts/test_pipeline_configuration.py"
      - "config/pipeline.json"
      - ".github/workflows/ankidroid-manifest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Manifest and card-by-card gates
        run: >-
          pytest -q
          flashcards/tests/test_manifesto_*.py
          flashcards/tests/test_release_e1_deck.py
          flashcards/tests/test_validar_deck_card_a_card.py
          flashcards/tests/test_qualidade_funcional_e_modos.py
          flashcards/tests/test_contrato_companion.py
          flashcards/scripts/test_pipeline_configuration.py
