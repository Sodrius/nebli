name: Deck APKG v13

on:
  workflow_dispatch:
  push:
    paths:
      - "FLASHCARDS.md"
      - "EXEMPLARES-CARDS.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "config/pipeline.json"
      - "flashcards/scripts/**"
      - "flashcards/tests/**"
      - "flashcards/schemas/**"
      - "docs/canon/**"
      - "typst-build/**/etapa1.typ"
      - ".github/workflows/deck-apkg.yml"
  pull_request:
    paths:
      - "FLASHCARDS.md"
      - "EXEMPLARES-CARDS.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "config/pipeline.json"
      - "flashcards/scripts/**"
      - "flashcards/tests/**"
      - "flashcards/schemas/**"
      - "docs/canon/**"
      - "typst-build/**/etapa1.typ"
      - ".github/workflows/deck-apkg.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema
      - name: Active v13 gates and regressions
        run: >-
          pytest -q
          flashcards/tests/test_e1_execution_contract.py
          flashcards/tests/test_learning_delta.py
          flashcards/tests/test_learning_delta_real_e1.py
          flashcards/tests/test_card_review.py
          flashcards/tests/test_schema_v13.py
          flashcards/tests/test_feedback_regressions.py
          flashcards/tests/test_apkg_export.py
          flashcards/tests/test_apkg_schema11.py
          flashcards/tests/test_apkg_duplicate_answers.py
          flashcards/tests/test_release_e1_deck.py
          flashcards/tests/test_validar_deck_card_a_card.py
          flashcards/tests/test_validar_e1_formatacao.py
          flashcards/tests/test_card_cue_quality.py
          flashcards/scripts/test_pipeline_configuration.py
