name: Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests including realistic 40-card batch
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK and Android integration test
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Download pinned official AnkiDroid
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ankidroid/Anki-Android/releases/download/v2.24.0/AnkiDroid-2.24.0-full-universal.apk \
            --output AnkiDroid-2.24.0.apk
          echo "5a124cb5cdee3fa269545b96702867b5ab3fa2fa7003eee52dea1914c9724e25  AnkiDroid-2.24.0.apk" | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android + AnkiDroid round trip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: android-companion
          script: bash ci/run-ankidroid-e2e.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nebli-ankidroid-companion-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
