# Aulas da UC01 — FMUSP, Turma 114, 2026
# Fonte: calendário oficial recebido de Davi em 2026-05-14.
# Cada aula vira um resumo NEBLI. O `slug` é a chave canônica usada no campo
# `aula:` do frontmatter de cada q-XXXX.md em banco/questoes/.
#
# Regra do QUESTIONADOR (Etapa 4):
#   Para temas de UC01, filtrar banco por `aula: <slug>` (filtro exato).
#   Para temas de outras UCs, continuar com grep amplo até a classificação
#   chegar nelas (ver CLAUDE.md > "Regras canônicas do QUESTIONADOR" > Etapa 4).
#
# Convenção de slug:
#   [disciplina-abrev]-[numero-da-aula-na-disciplina]-[tema-curto]
#   disciplinas: bioq | fisio | biocel | biomol
#   numero: o que está entre parênteses no calendário oficial (ex: "Bioquímica (5)" → 05)
#   tema-curto: 2–4 palavras kebab-case
#
# Aulas com 2 partes (ex: Hemoglobina I/II) ganham sufixo "a"/"b" no número.

