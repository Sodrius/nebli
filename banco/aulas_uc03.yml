# Aulas da UC03 — FMUSP, Turma 114, 2026
# UC03 = "Princípios do Desenvolvimento das Doenças" (FMUSP / ICB / IQ).
# Fonte P1+P2: tabela oficial da UC03 na planilha de cronograma do Davi (colunas Data/Horário/
#   Local/N/C/Tema/P), lida em 2026-08-27.
# Fonte P3+P4: cronograma mensal da MESMA planilha (as linhas da tabela oficial só iam até o
#   conteúdo 33 / 18-09). Marcadas `provisorio: true` — confirmar com Davi quando a tabela oficial
#   for estendida. Título e data vêm do calendário; o número de conteúdo (`conteudo:`) fica vazio.
#
# Convenção de slug (mesma família de aulas_uc01/uc02):
#   [componente-abrev]-[numero-na-componente]-[tema-curto]
#   componentes UC03:
#     rad     -> Radiologia / diagnóstico por imagem      (código da prova: RD)
#     pat     -> Patologia geral                          (código da prova: PT)
#     imuno   -> Imunologia                               (código da prova: IM)
#     micro   -> Microbiologia (bacterio, mico, virologia)(código da prova: MB)
#     biomol  -> Biologia Molecular + Bioquímica          (códigos da prova: BM, BQ, BQ/BM)
#     pat-rad -> aula-correlação Patologia × Radiologia   (código da prova: PT-RD)
#     gr      -> Grand Round (integrada, todas as áreas)  (código da prova: GR)
#   `conteudo:` = número oficial do conteúdo na UC03 (é ele que a prova cita, não a ordem do dia).
#   `apelidos:` = slugs alternativos já usados em resumos gerados (o consultar.py aceita os dois).
#   `chaves:` = termos de busca usados por referencias-externas/uc03/consultar.py para achar,
#   no acervo de provas, as questões que pertencem A ESTA aula — e só a ela.
#
# REGRA DE ESCOPO (canônica para UC03, 2026-08-27):
#   A prova da UC03 é integrada por CASO CLÍNICO, mas cada subquestão é etiquetada por uma única
#   área. O resumo NEBLI é da AULA, não do caso: o que entra é o que pertence ao slug. Conteúdo de
#   outra aula só aparece como retomada de 1-2 frases quando o mecanismo desta aula depende dele —
#   nunca como subtópico próprio. Detalhe em referencias-externas/uc03/CALIBRACAO.md § Fronteiras.

