#     imuno   -> Imunologia
#   numero: ordem dentro da disciplina, continuando a numeração de UC01 quando aplicável.
#   tema-curto: 2–4 palavras kebab-case.
#
# Cronograma pós-greve: apenas 3 provas (16/jun, 30/jun, 16/jul).
# Aulas removidas vs pré-greve:
